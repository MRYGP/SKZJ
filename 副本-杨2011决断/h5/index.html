<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>人生馆001号｜2011 · 那只水杯</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080807;
      --panel: #11110f;
      --ink: #f2eadb;
      --muted: #b9ad99;
      --cold: #6d8aa4;
      --warm: #d5aa63;
      --line: rgba(255,255,255,.14);
      --shadow: 0 24px 70px rgba(0,0,0,.55);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(129,111,76,.22), transparent 36%),
        linear-gradient(180deg, #171512 0%, #070707 78%);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      overflow: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.07);
      cursor: pointer;
    }

    .app {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .phone {
      width: min(420px, calc(100vw - 28px));
      height: min(820px, calc(100vh - 28px));
      min-height: 640px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 28px;
      background: #0c0c0b;
      box-shadow: var(--shadow);
      isolation: isolate;
      user-select: none;
      touch-action: manipulation;
    }

    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(180deg, rgba(11,13,16,.1), rgba(0,0,0,.58)),
        #111;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--image);
      background-size: cover;
      background-position: center;
      opacity: var(--image-opacity, .88);
      transform: scale(1.03);
      transition: opacity .45s ease, filter .45s ease;
      filter: var(--image-filter, saturate(.82) contrast(1.05) brightness(.82));
      z-index: -2;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 58%, transparent 0 28%, rgba(0,0,0,.54) 76%),
        linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.72));
      z-index: -1;
    }

    .stage.cold::after {
      background:
        radial-gradient(circle at 50% 60%, transparent 0 22%, rgba(0,0,0,.62) 76%),
        linear-gradient(180deg, rgba(12,26,43,.22), rgba(0,0,0,.76));
    }

    .stage.warm::after {
      background:
        radial-gradient(circle at 50% 60%, rgba(214,166,84,.08), transparent 34%, rgba(0,0,0,.55) 78%),
        linear-gradient(180deg, rgba(20,14,7,.14), rgba(0,0,0,.68));
    }

    .stage.blackout,
    .stage.blackout::after {
      background: #000;
    }

    .hud {
      position: absolute;
      inset: 16px 16px auto;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .progress {
      height: 3px;
      flex: 1;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.16);
    }

    .progress span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cold), var(--warm));
      transition: width .28s ease;
    }

    .sound-toggle {
      width: 48px;
      height: 44px;
      border-radius: 99px;
      background: rgba(0,0,0,.28);
      color: var(--muted);
      font-size: 12px;
      pointer-events: auto;
    }

    .sound-retry {
      position: absolute;
      left: 50%;
      bottom: 20px;
      z-index: 9;
      min-height: 44px;
      padding: 10px 16px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: rgba(15, 12, 9, .9);
      color: #f3dfb8;
      border: 1px solid rgba(243, 223, 184, .46);
      font-size: 13px;
      white-space: nowrap;
    }

    .sound-retry[hidden] { display: none; }

    .content {
      position: absolute;
      inset: 0;
      display: grid;
      align-content: end;
      gap: 18px;
      padding: 70px 26px 38px;
      z-index: 2;
    }

    .content > :not(.micro-scene) {
      position: relative;
      z-index: 1;
    }

    .kicker {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0;
    }

    .title {
      font-size: 30px;
      line-height: 1.16;
      font-weight: 700;
      text-wrap: balance;
    }

    .text {
      white-space: pre-line;
      font-size: 24px;
      line-height: 1.45;
      font-weight: 650;
      text-shadow: 0 2px 18px rgba(0,0,0,.72);
      text-wrap: balance;
    }

    .text.small {
      font-size: 19px;
      line-height: 1.62;
      font-weight: 560;
    }

    .text.center {
      align-self: center;
      text-align: center;
      font-size: 30px;
      line-height: 1.35;
    }

    .narration-subtitle {
      width: 100%;
      max-height: 34vh;
      overflow: hidden;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(0,0,0,.44), rgba(0,0,0,.62));
      text-shadow: 0 2px 14px rgba(0,0,0,.78);
    }

    .caption {
      display: inline-block;
      width: fit-content;
      max-width: 100%;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 6px;
      background: rgba(0,0,0,.38);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .review-excerpt {
      width: min(100%, 330px);
      padding: 12px 14px 13px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 6px;
      background: rgba(232,237,240,.9);
      color: #131a20;
      box-shadow: 0 18px 44px rgba(0,0,0,.42);
      font-family: "SimSun", "Microsoft YaHei", serif;
      transform: rotate(-.25deg);
    }

    .review-site {
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(27,51,70,.22);
      color: #31506b;
      font-size: 11px;
      line-height: 1.2;
    }

    .review-title {
      margin-top: 8px;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 700;
      color: #0f1720;
    }

    .review-body {
      margin-top: 8px;
      white-space: pre-line;
      font-size: 12px;
      line-height: 1.56;
      color: #2c3740;
    }

    .review-cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      margin-left: 3px;
      background: #26333d;
      vertical-align: -2px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .qq-panel {
      width: min(100%, 330px);
      padding: 11px 12px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px;
      background: rgba(232,237,242,.92);
      color: #111b24;
      box-shadow: 0 18px 44px rgba(0,0,0,.44);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .qq-title {
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(20,44,64,.2);
      color: #1d4d76;
      font-size: 13px;
      font-weight: 700;
    }

    .qq-msg {
      margin-top: 8px;
      padding: 7px 8px;
      border-radius: 5px;
      background: rgba(255,255,255,.72);
      font-size: 12px;
      line-height: 1.42;
      color: #26333d;
    }

    .sms-panel {
      justify-self: start;
      width: min(100%, 286px);
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px;
      background: rgba(236,239,234,.94);
      color: #131912;
      box-shadow: 0 16px 40px rgba(0,0,0,.42);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      transform: rotate(-.35deg);
    }

    .sms-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(45,60,45,.18);
      color: #4f5d4d;
      font-size: 11px;
      line-height: 1.2;
    }

    .sms-message {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 650;
    }

    .content[data-card-id="card-15c"] .text.small {
      font-size: 18px;
      line-height: 1.58;
    }

    .novel-panel {
      width: min(100%, 330px);
      padding: 11px 12px 12px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px;
      background: rgba(236,232,218,.9);
      color: #151914;
      box-shadow: 0 18px 44px rgba(0,0,0,.44);
      font-family: "SimSun", "Microsoft YaHei", serif;
    }

    .novel-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(38,45,33,.2);
      color: #39452f;
      font-size: 12px;
      line-height: 1.2;
    }

    .novel-list {
      margin-top: 8px;
      display: grid;
      gap: 6px;
      font-size: 12px;
      line-height: 1.4;
      color: #26301f;
    }

    .novel-next {
      margin-top: 9px;
      width: fit-content;
      padding: 5px 9px;
      border: 1px solid rgba(57,69,47,.24);
      border-radius: 5px;
      background: rgba(255,255,255,.56);
      color: #2c3825;
      font-size: 12px;
    }

    .content.screen-card {
      display: block;
      padding: 0;
    }

    .screen-page {
      position: absolute;
      left: var(--screen-left);
      top: var(--screen-top);
      width: var(--screen-width);
      height: var(--screen-height);
      z-index: 1;
      overflow: hidden;
      border-radius: 3px;
      opacity: .88;
      filter: saturate(.82) contrast(.94) blur(.08px);
      transform: rotate(var(--screen-rotate, 0deg));
      transform-origin: center;
      box-shadow:
        inset 0 0 0 1px rgba(35,73,117,.24),
        inset 0 0 36px rgba(45,103,172,.18);
    }

    .content.screen-card > .screen-page {
      position: absolute;
    }

    /* card-06 原生图仍烙有旧群名；本层只覆盖群名，原图不改。 */
    .native-title-fix {
      position: absolute;
      left: 27.7%;
      top: 24.7%;
      width: 27.5%;
      height: 2.45%;
      z-index: 3;
      display: flex;
      align-items: center;
      padding-left: 1.25%;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(185,210,229,.99), rgba(151,187,216,.99));
      color: #263746;
      font: 600 10px/1 "Microsoft YaHei", "PingFang SC", sans-serif;
      letter-spacing: 0;
      white-space: nowrap;
      text-shadow: 0 1px rgba(255,255,255,.42);
      transform: rotate(.05deg);
      box-shadow: inset 0 1px rgba(229,241,250,.45), inset 0 -1px rgba(91,137,173,.3);
      pointer-events: none;
    }

    .screen-page::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(180deg, rgba(255,255,255,.08) 0 1px, transparent 1px 4px),
        linear-gradient(90deg, rgba(0,58,140,.12), transparent 22%, rgba(0,47,110,.16));
      mix-blend-mode: multiply;
    }

    .screen-page.novel {
      background: rgba(236,232,218,.72);
    }

    .screen-page.review {
      background: rgba(232,239,247,.64);
    }

    .screen-page.history {
      background: rgba(222,232,238,.72);
    }

    .screen-page .review-excerpt,
    .screen-page .novel-panel {
      width: auto;
      height: 100%;
      max-width: none;
      padding: 9px 11px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      transform: none;
    }

    .screen-page .review-site,
    .screen-page .novel-head {
      font-size: 9px;
      line-height: 1.2;
      opacity: .72;
    }

    .screen-page .review-title {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.25;
    }

    .screen-page .review-body {
      margin-top: 6px;
      font-size: 9px;
      line-height: 1.5;
      color: rgba(26,35,43,.82);
    }

    .screen-page .review-excerpt.review-long {
      padding: 7px 9px;
    }

    .screen-page .review-long .review-title {
      font-size: 12px;
      line-height: 1.2;
    }

    .screen-page .review-long .review-body {
      font-size: 8px;
      line-height: 1.42;
    }

    .screen-page .novel-list {
      gap: 4px;
      font-size: 10px;
      line-height: 1.38;
      color: rgba(38,48,31,.82);
    }

    .screen-page .novel-next {
      margin-top: 6px;
      padding: 4px 7px;
      font-size: 10px;
      background: rgba(255,255,255,.42);
    }

    .history-panel {
      width: min(100%, 330px);
      padding: 11px 12px 12px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px;
      background: rgba(238,243,246,.88);
      color: #1f3445;
      box-shadow: 0 12px 28px rgba(0,0,0,.25);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .history-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(25,50,68,.22);
      color: rgba(30,54,72,.72);
      font-size: 10px;
      line-height: 1.2;
    }

    .history-list {
      display: grid;
      gap: 4px;
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.38;
      color: rgba(24,38,49,.88);
    }

    .history-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 3px;
      border-bottom: 1px solid rgba(34,58,76,.12);
      white-space: nowrap;
    }

    .history-date {
      color: rgba(42,67,84,.52);
      font-size: .9em;
      flex: 0 0 auto;
    }

    .screen-page .history-panel {
      width: auto;
      height: 100%;
      max-width: none;
      padding: 8px 10px;
      overflow: hidden;
    }

    .screen-page .history-head {
      font-size: 8px;
    }

    .screen-page .history-list {
      gap: 2px;
      margin-top: 5px;
      font-size: 9px;
      line-height: 1.22;
    }

    .screen-page.locked-review {
      background: rgba(241,244,239,.96);
      opacity: .95;
      filter: saturate(.96) contrast(1.02);
      box-shadow:
        0 16px 42px rgba(0,0,0,.38),
        inset 0 0 0 1px rgba(35,73,117,.2);
    }

    .fact-pin {
      position: absolute;
      left: var(--fact-left, 7%);
      top: var(--fact-top, 57%);
      width: var(--fact-width, 42%);
      z-index: 5;
      padding: 12px 14px;
      border: 1px solid rgba(45,36,24,.2);
      border-radius: 4px;
      background:
        linear-gradient(180deg, rgba(243,238,220,.97), rgba(218,208,181,.96));
      box-shadow: 0 18px 40px rgba(0,0,0,.38);
      color: #2a241b;
      font-family: "KaiTi", "SimSun", serif;
      font-size: 20px;
      line-height: 1.7;
      letter-spacing: 0;
      transform: rotate(var(--fact-rotate, -2deg));
      white-space: pre-line;
    }

    .content > .fact-pin {
      position: absolute;
      z-index: 5;
    }

    .choice {
      width: 100%;
      min-height: 56px;
      padding: 13px 14px;
      border-radius: 8px;
      text-align: left;
      background: rgba(10,10,9,.72);
      backdrop-filter: blur(10px);
      line-height: 1.35;
    }

    .choice:active { transform: translateY(1px); }

    .cover {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      align-content: end;
      gap: 18px;
      padding: 40px 28px;
      background: #000;
    }

    .cover-tag {
      color: rgba(255,255,255,.68);
      font-size: 13px;
      letter-spacing: .08em;
    }

    .version-mark {
      position: absolute;
      right: 12px;
      bottom: 10px;
      color: rgba(255,255,255,.25);
      font-size: 9px;
      line-height: 1;
      letter-spacing: .02em;
      pointer-events: none;
    }

    .primary {
      width: 100%;
      min-height: 54px;
      border-radius: 8px;
      background: #f0d5a6;
      color: #1b130b;
      border: 0;
      font-weight: 700;
    }

    .secondary {
      width: 100%;
      min-height: 46px;
      border-radius: 8px;
      background: rgba(0,0,0,.42);
      color: #efe3cf;
      font-size: 14px;
    }

    .muted-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 0;
    }

    .cover-hook {
      margin: 0;
      color: #f3dfb8;
      font-size: 20px;
      line-height: 1.45;
      font-weight: 650;
      text-shadow: 0 2px 18px rgba(0,0,0,.72);
      text-wrap: balance;
    }

    .paused .hint { opacity: 1; }

    .hint {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 8;
      transform: translate(-50%, -50%);
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(0,0,0,.72);
      color: var(--muted);
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }

    .photo-stack {
      align-self: center;
      display: grid;
      gap: 12px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 12px;
      position: relative;
    }

    .photo-stack.has-memory {
      gap: 8px;
    }

    .photo-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    .photo-row img,
    .photo-main {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.16);
      filter: saturate(.86) contrast(1.04);
    }

    .photo-main { max-height: 360px; }

    .photo-stack.has-memory .photo-main {
      max-height: 304px;
    }

    .frog-drift {
      height: 190px;
      margin-top: 8px;
      border-radius: 12px;
      overflow: hidden;
      opacity: .86;
      filter: saturate(.98) contrast(1.08) brightness(1.08);
      position: relative;
      z-index: 1;
    }

    .photo-stack.has-memory .frog-drift {
      position: absolute;
      right: 10px;
      bottom: 74px;
      width: min(22vw, 78px);
      max-width: 78px;
      aspect-ratio: 9 / 16;
      height: auto;
      margin-top: 0;
      justify-self: center;
      opacity: .72;
      z-index: 4;
      box-shadow: 0 18px 40px rgba(0,0,0,.5);
      background:
        radial-gradient(circle at 50% 64%, rgba(217,137,45,.28), transparent 52%),
        rgba(0,0,0,.38);
    }

    .frog-drift img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: none;
      animation: frogBreath 36s ease-in-out infinite alternate;
    }

    @keyframes frogBreath {
      from { filter: brightness(.96) saturate(.94); opacity: .9; }
      to   { filter: brightness(1.08) saturate(1.04); opacity: 1; }
    }

    .memory-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      opacity: .56;
      animation: memoryPulse 18s ease-in-out infinite alternate;
    }

    .memory-strip img {
      width: 100%;
      height: 36px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.12);
      filter: saturate(.7) contrast(1.05) brightness(.78);
    }

    @keyframes memoryPulse {
      from { opacity: .38; transform: translateY(1px); }
      to   { opacity: .66; transform: translateY(-1px); }
    }

    .content.photo-card {
      display: block;
      padding: 0;
    }

    .photo-visual {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .photo-visual .frog-drift {
      position: absolute;
      left: 18px;
      bottom: calc(50% + 22px);
      width: 58px;
      height: 104px;
      margin: 0;
      opacity: .34;
      box-shadow: 0 16px 34px rgba(0,0,0,.46);
      background: rgba(0,0,0,.18);
    }

    .rolling-caption {
      position: absolute;
      left: 50%;
      right: auto;
      bottom: 28px;
      width: calc(100% - 36px);
      height: min(24%, 180px);
      transform: translateX(-50%);
      z-index: 3;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.46), rgba(0,0,0,.64)),
        rgba(0,0,0,.42);
      box-shadow: 0 18px 48px rgba(0,0,0,.38);
    }

    .content.dual-caption {
      align-content: stretch;
    }

    .content.dual-caption .tail-display-text {
      position: absolute;
      left: 26px;
      right: 26px;
      top: 76px;
      bottom: calc(min(24%, 180px) + 58px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 22px;
      line-height: 1.42;

    const stage      = document.getElementById("stage");
    const content    = document.getElementById("content");
    const cover      = document.getElementById("cover");
    const startBtn   = document.getElementById("startBtn");
    const progressBar= document.getElementById("progressBar");
    const phone      = document.getElementById("phone");
    const voiceToggle= document.getElementById("voiceToggle");
    const soundRetry = document.getElementById("soundRetry");

    let index       = 0;
    let timer       = null;
    let activeAudio = null;
    let running     = false;
    let paused      = false;
    let pressTimer  = null;
    let finalStopTimer = null;
    let touchMoved  = false;
    let longPressTriggered = false;
    let lastAdvanceAt = 0;
    let pendingAudioCard = null;
    let audioContext= null;
    let soundNodes  = [];

    // ─── Bed / BGM state ────────────────────────────────────────
    let bedAudio       = null;
    let bgmAudio       = null;
    let currentBedType = null;   // tracks running bed type to avoid restarts
    let bgmRunning     = false;
    let currentBgmType = null;

    // ─── Helpers ────────────────────────────────────────────────
    function escapeHtml(v) {
      return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    const loadedImageUrls = new Set();
    const imagePreloadJobs = new Map();

    function imageCssValue(src) {
      return `url("${src}")`;
    }

    function preloadImage(src) {
      if (!src) return Promise.resolve("");
      if (loadedImageUrls.has(src)) return Promise.resolve(src);
      if (imagePreloadJobs.has(src)) return imagePreloadJobs.get(src);

      const img = new Image();
      img.decoding = "async";
      const job = new Promise(resolve => {
        img.onload = () => {
          loadedImageUrls.add(src);
          resolve(src);
        };
        img.onerror = () => {
          console.warn("Image failed to load:", src);
          resolve("");
        };
      });
      imagePreloadJobs.set(src, job);
      img.src = src;
      return job;
    }

    function setImage(card) {
      stage.classList.toggle("has-visual", !!(card && card.visual));
      stage.classList.toggle("blackout", !!(card && card.blackout));
      const src = card && card.img ? card.img : "";
      if (src) {
        stage.dataset.pendingImage = src;
        if (loadedImageUrls.has(src)) {
          stage.style.setProperty("--image", imageCssValue(src));
        } else {
          preloadImage(src).then(loadedSrc => {
            if (loadedSrc && stage.dataset.pendingImage === loadedSrc) {
              stage.style.setProperty("--image", imageCssValue(loadedSrc));
            }
          });
          if (!stage.style.getPropertyValue("--image")) {
            stage.style.setProperty("--image", imageCssValue(src));
          }
        }
      } else if (card && card.clearImage) {
        stage.dataset.pendingImage = "";
        stage.style.setProperty("--image", "none");
      } else if (!stage.style.getPropertyValue("--image")) {
        stage.style.setProperty("--image", "none");
      }
      stage.style.setProperty("--image-opacity", card && card.imgOpacity !== undefined ? card.imgOpacity : ".88");
      stage.style.setProperty("--image-filter", card && card.imgFilter ? card.imgFilter : "saturate(.82) contrast(1.05) brightness(.82)");
      stage.classList.toggle("cold", card && card.mood === "cold");
      stage.classList.toggle("warm", card && card.mood === "warm");
    }

    // ─── Oscillator soundscape (unchanged, for drop / thin) ─────
    function stopSoundscape() {
      soundNodes.forEach(n => { try { if(n.stop) n.stop(); if(n.disconnect) n.disconnect(); } catch(e){} });
      soundNodes = [];
    }

    function startSoundscape(type) {
      stopSoundscape();
      // silence = nothing; fan/street can reach here as file-load fallbacks.
      if (!type || type === "silence") return;
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") audioContext.resume().catch(()=>{});
      const gain = audioContext.createGain();
      gain.gain.value = type === "drop" ? 0.03 : type === "thin" ? 0.018 : 0.026;
      gain.connect(audioContext.destination);
      const osc = audioContext.createOscillator();
      osc.type = "sine";
      osc.frequency.value = type === "drop" ? 48 : type === "thin" ? 82 : type === "fan" ? 58 : 66;
      osc.connect(gain); osc.start();
      soundNodes.push(osc, gain);
      if (type === "drop") {
        const lfoGain = audioContext.createGain();
        const lfo = audioContext.createOscillator();
        lfo.frequency.value = 0.55; lfoGain.gain.value = 11;
        lfo.connect(lfoGain); lfoGain.connect(osc.frequency); lfo.start();
        soundNodes.push(lfo, lfoGain);
      }
    }

    // ─── File-based bed ─────────────────────────────────────────
    function startBed(type) {
      if (type === currentBedType) return;   // already playing this bed
      currentBedType = type;

      if (bedAudio) { bedAudio.pause(); bedAudio = null; }

      const src = BED_FILES[type];
      if (!src) return;

      const a = new Audio(src);
      a.loop   = true;
      a.volume = BED_VOLUMES[type] ?? 0.18;
      bedAudio = a;
      a.play().catch(() => {
        // fallback: oscillator hum
        startSoundscape(type);
      });
    }

    function stopBed() {
      currentBedType = null;
      if (bedAudio) { bedAudio.pause(); bedAudio = null; }
    }

    // ─── BGM ────────────────────────────────────────────────────
    function startBgm(type = "warmLow") {
      if (bgmAudio && bgmRunning && currentBgmType === type) return;
      stopBgm();
      const src = BGM_FILES[type];
      if (!src) return;
      const a = new Audio(src);
      a.loop = true;
      a.volume = BGM_VOLUMES[type] ?? 0.035;
      bgmAudio = a;
      bgmRunning = true;
      currentBgmType = type;
      a.play().catch(() => { bgmRunning = false; });
    }

    function stopBgm() {
      bgmRunning = false;
      currentBgmType = null;
      if (bgmAudio) { bgmAudio.pause(); bgmAudio = null; }
    }

    // ─── SFX one-shot ───────────────────────────────────────────
    function playSfx(keys) {
      if (!keys || !keys.length) return;
      keys.forEach(key => {
        const src = SFX[key];
        if (!src) return;
        const a = new Audio(src);
        a.volume = 0.68;
        a.play().catch(() => {});
      });
    }

    // ─── Audio lifecycle ────────────────────────────────────────
    function stopAudio() {
      if (activeAudio) { activeAudio.pause(); activeAudio = null; }
      pendingAudioCard = null;
      soundRetry.hidden = true;
      stopSoundscape();
      // NOTE: bed and bgm are NOT stopped here; they persist across cards
    }

    function stopAllAudio() {
      stopAudio();
      stopBed();
      stopBgm();
    }

    function clearFinalStopTimer() {
      if (finalStopTimer) {
        clearTimeout(finalStopTimer);
        finalStopTimer = null;
      }
    }

    function scheduleFinalStop(card) {
      clearFinalStopTimer();
      if (!running || paused || index !== cards.length - 1) return;
      finalStopTimer = window.setTimeout(() => {
        finalStopTimer = null;
        stopAllAudio();
      }, durationFor(card) + 5000);
    }

    function durationFor(card) {
      if (card.fixed) return card.fixed;
      const chars = (card.text||"").replace(/\s/g,"").length;
      return Math.max(3800, Math.min(12000, 2200 + chars * 180));
    }

    function progressValue() {
      const playable = cards.filter(c => !c.pause).length;
      const played   = cards.slice(0, index + 1).filter(c => !c.pause).length;
      return Math.min(100, Math.max(0, (played / playable) * 100));
    }

    function updateProgress() {
      progressBar.style.width = `${progressValue()}%`;
    }

    function playAudio(card, done) {
      if (activeAudio) { activeAudio.pause(); activeAudio = null; }
      const src = card.audioFull || (card.tts ? `${TTS_DIR}${card.tts}` : card.audio ? `${voiceSets[voiceSet]}${card.audio}` : "");
      if (!src) return false;
      const audio = new Audio(src);
      activeAudio = audio;
      let settled = false;
      const fallback = () => {
        if (settled || audio !== activeAudio) return;
        settled = true;
        pendingAudioCard = card;
        soundRetry.hidden = false;
        done(false);
      };
      audio.addEventListener("ended", () => { if (settled || audio !== activeAudio) return; settled=true; done(true); });
      audio.addEventListener("error", fallback, { once: true });
      audio.play().catch(fallback);
      return true;
    }

    function schedule(card) {
      clearTimeout(timer);
      if (!running || paused || card.pause || index >= cards.length - 1) return;
      timer = window.setTimeout(next, durationFor(card));
    }

    function visualMarkup(name) {
      if (name === "black") return "";
      const cls = { screen:"micro-screen", desk:"micro-desk", cup:"micro-cup",
        reach:"micro-reach", freeze:"micro-freeze", still:"micro-still", abyss:"micro-abyss" }[name] || "micro-desk";
      return `<div class="micro-scene ${cls}" aria-hidden="true">
        <div class="desk"></div><div class="mess m1"></div><div class="mess m2"></div>
        <div class="mess m3"></div><div class="ash"></div><div class="cup"></div>
        <div class="hand"></div><div class="distance-mark"></div></div>`;
    }

    const PAUSE_IMAGES = {
      reach: "assets/img/pause-0-reach-v17-eye-pov-20260706.jpg",
      still: "assets/img/pause-0-still-v17-eye-pov-20260706.jpg",
      freeze: "assets/img/pause-0-still-v17-eye-pov-20260706.jpg",
    };

    function warmAllImages() {
      const refs = new Set();
      cards.forEach(card => {
        if (card.img) refs.add(card.img);
        if (card.frog) refs.add(card.frog);
        (card.memoryImgs || []).forEach(src => refs.add(src));
      });
      Object.values(PAUSE_IMAGES).forEach(src => refs.add(src));

      refs.forEach(src => {
        const link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.href = src;
        document.head.appendChild(link);
        preloadImage(src);
      });
    }

    warmAllImages();

    function pauseImageMarkup(name) {
      const src = PAUSE_IMAGES[name] || PAUSE_IMAGES.still;
      return `<img src="${escapeHtml(src)}" alt="">`;
    }

    function reviewMarkup(card) {
      if (!card.review) return "";
      const longClass = card.review.long ? " review-long" : "";
      return `<div class="review-excerpt${longClass}">
        <div class="review-site">${escapeHtml(card.review.site)}</div>
        <div class="review-title">${escapeHtml(card.review.title)}</div>
        <div class="review-body">${escapeHtml(card.review.body)}${card.review.cursor ? `<span class="review-cursor"></span>` : ""}</div>
      </div>`;
    }

    function qqMarkup(card) {
      if (!card.qq) return "";
      return `<div class="qq-panel">
        <div class="qq-title">${escapeHtml(card.qq.title)}</div>
        ${(card.qq.messages || []).map(msg => `<div class="qq-msg">${escapeHtml(msg)}</div>`).join("")}
      </div>`;
    }

    function smsMarkup(card) {
      if (!card.sms) return "";
      return `<div class="sms-panel">
        <div class="sms-title"><span>${escapeHtml(card.sms.title || "短信")}</span><span>${escapeHtml(card.sms.time || "")}</span></div>
        <div class="sms-message">${escapeHtml(card.sms.message)}</div>
      </div>`;
    }

    function phonePanelMarkup(card) {
      if (!card.phonePanel) return "";
      const calls = (card.phonePanel.calls || []).map(row => `
        <div class="call-row">
          <span>${escapeHtml(row[0])}</span>
          <span>${escapeHtml(row[1])}</span>
          <span>${escapeHtml(row[2])}</span>
          <span>${escapeHtml(row[3])}</span>
        </div>`).join("");
      const messages = (card.phonePanel.messages || []).map(row => `
        <div class="sent-row">
          <span class="sent-name">→ ${escapeHtml(row[0])}</span>
          <span>${escapeHtml(row[1])}</span>
        </div>`).join("");
      return `<div class="evidence-card phone-evidence">
        <div class="evidence-title"><span>通话记录</span><span>2011</span></div>
        <div class="call-list">${calls}</div>
        <div class="sent-list">${messages}</div>
      </div>`;
    }

    function searchPanelMarkup(card) {
      if (!card.searchPanel) return "";
      return `<div class="evidence-card search-evidence">
        <div class="evidence-title"><span>百度搜索</span><span>夜里</span></div>
        <div class="search-list">${(card.searchPanel.terms || []).map((term, i) => `
          <div class="search-row"><span class="search-index">${i + 1}</span><span>${escapeHtml(term)}</span></div>
        `).join("")}</div>
      </div>`;
    }

    function notebookPanelMarkup(card) {
      if (!card.notebookPanel) return "";
      const pageMarkup = (title, rows) => `<div class="notebook-page">
        <div class="notebook-page-title">${escapeHtml(title)}</div>
        ${(rows || []).map(row => `<div class="notebook-line">${escapeHtml(row)}</div>`).join("")}
      </div>`;
      return `<div class="evidence-card notebook-evidence">
        ${pageMarkup("要点", card.notebookPanel.left)}
        ${pageMarkup("电话", card.notebookPanel.right)}
      </div>`;
    }

    function evidenceMarkup(card) {
      if (!card) return "";
      const html = `${phonePanelMarkup(card)}${searchPanelMarkup(card)}${notebookPanelMarkup(card)}`;
      return html ? `<div class="evidence-stack" aria-label="屏内物证">${html}</div>` : "";
    }

    function novelMarkup(card) {
      if (!card.novel) return "";
      const head = card.novel.head || [];
      return `<div class="novel-panel">
        <div class="novel-head"><span>${escapeHtml(head[0] || "玄幻小说")}</span><span>${escapeHtml(head[1] || "")}</span></div>
        <div class="novel-list">${(card.novel.rows || []).map(row => `<div>${escapeHtml(row)}</div>`).join("")}</div>
        ${card.novel.next ? `<div class="novel-next">${escapeHtml(card.novel.next)}</div>` : ""}
      </div>`;
    }

    function movieHistoryMarkup(card) {
      if (!card.movieHistory) return "";
      const history = card.movieHistory;
      return `<div class="history-panel">
        <div class="history-head"><span>${escapeHtml(history.site || "Mtime 时光网")}</span><span>2011</span></div>
        <div class="review-title">${escapeHtml(history.title || "我看过的电影")}</div>
        <div class="history-list">${(history.rows || []).map((row, index) => `<div class="history-row"><span>${escapeHtml(row)}</span><span class="history-date">${index + 1}</span></div>`).join("")}</div>
      </div>`;
    }

    const SCREEN_PAGES = {
      "card-03": { type: "novel",  left: "15.0%", top: "35.6%", width: "61.0%", height: "20.8%", rotate: "-.15deg" },
      "card-04": { type: "history", left: "11.5%", top: "29.2%", width: "76.8%", height: "34.6%", rotate: ".22deg" },
      "card-05": { type: "review", left: "9.2%",  top: "27.4%", width: "81.6%", height: "31.4%", rotate: ".35deg" },
      "card-07": { type: "review", left: "12.4%", top: "24.2%", width: "75.8%", height: "27.8%", rotate: ".1deg" },
    };
    // 这些卡的承重字已逐字核在原生图中，不再叠加 CSS 准字层。
    const TEXTLESS_VISUAL_CARDS = new Set(["card-03", "card-04", "card-06", "card-15c"]);

    function hideVisualText(card) {
      return card && TEXTLESS_VISUAL_CARDS.has(card.id);
    }

    function screenPage(card) {
      return card ? SCREEN_PAGES[card.id] : null;
    }

    function screenPageStyle(page) {
      return [
        `--screen-left:${page.left}`,
        `--screen-top:${page.top}`,
        `--screen-width:${page.width}`,
        `--screen-height:${page.height}`,
        `--screen-rotate:${page.rotate || "0deg"}`,
      ].join(";");
    }

    function pageMarkup(card) {
      const nativeFix = card && card.id === "card-06"
        ? `<div class="native-title-fix" aria-label="92届初中同学群">92届初中同学群</div>`
        : "";
      if (hideVisualText(card)) return nativeFix;
      const page = screenPage(card);
      if (page && (card.review || card.novel || card.movieHistory)) {
        const lockClass = card.lockScreen ? " locked-review" : "";
        return `<div class="screen-page ${page.type}${lockClass}" style="${screenPageStyle(page)}">
          ${reviewMarkup(card)}
          ${novelMarkup(card)}
          ${movieHistoryMarkup(card)}
        </div>`;
      }
      return `${nativeFix}${reviewMarkup(card)}${qqMarkup(card)}${smsMarkup(card)}${novelMarkup(card)}${movieHistoryMarkup(card)}${evidenceMarkup(card)}`;
    }

    function factPinMarkup(card) {
      if (!card.factPin) return "";
      const pin = card.factPin;
      const style = [
        `--fact-left:${pin.left || "7%"}`,
        `--fact-top:${pin.top || "57%"}`,
        `--fact-width:${pin.width || "42%"}`,
        `--fact-rotate:${pin.rotate || "-2deg"}`,
      ].join(";");
      return `<div class="fact-pin" style="${style}">${escapeHtml(pin.text)}</div>`;
    }

    function captionMarkup(card) {
      return card.caption && !screenPage(card) && !hideVisualText(card)
        ? `<div class="caption">${escapeHtml(card.caption)}</div>`
        : "";
    }

    function textMarkup(card, cls) {
      if (!card.text) return "";
      if ((card.audio || card.tts) && card.kind !== "center") {
        return `<div class="${cls} narration-subtitle">${escapeHtml(card.text)}</div>`;
      }
      if (hideVisualText(card)) return "";
      if ((card.review || card.novel || card.movieHistory) && screenPage(card)) return "";
      return `<div class="${cls}">${escapeHtml(card.text)}</div>`;
    }

    function renderVisual(card) {
      content.innerHTML = `
        ${visualMarkup(card.visual)}
        ${captionMarkup(card)}
        ${pageMarkup(card)}
        ${textMarkup(card, `text ${card.kind==="center"?"center":"small"}`)}`;
    }

    function screenCycleMarkup(mode) {
      return `<div class="screen-cycle screen-cycle--${mode}" aria-hidden="true">
        <div class="screen-cycle__desktop">
          <div class="screen-cycle__window screen-cycle__window--movie"></div>
          <div class="screen-cycle__window screen-cycle__window--novel"></div>
        </div>
        <div class="screen-cycle__saver"></div>
        <div class="screen-cycle__black"></div>
      </div>`;
    }

    function renderNightTail() {
      content.innerHTML = `<div class="night-tail">${screenCycleMarkup("sleep")}</div>`;
    }

    function renderDayStart(card) {
      const subtitle = card.text ? `<div class="text small narration-subtitle">${escapeHtml(card.text)}</div>` : "";
      content.innerHTML = `
        <div class="day-start">${screenCycleMarkup("wake")}</div>
        ${subtitle}`;
    }

    function memoryMarkup(card) {
      if (!card.memoryImgs || !card.memoryImgs.length) return "";
      return `<div class="memory-strip" aria-hidden="true">${
        card.memoryImgs.map(src => `<img src="${escapeHtml(src)}" alt="">`).join("")
      }</div>`;
    }

    function renderPhoto(card) {
      content.innerHTML = `
        <div class="photo-visual" aria-hidden="true">
          ${card.frog ? `<div class="frog-drift" aria-hidden="true"><img src="${escapeHtml(card.frog)}" alt=""></div>` : ""}
          ${memoryMarkup(card)}
        </div>
        <div class="rolling-caption" aria-label="正文字幕">
          <div class="rolling-caption-text">${escapeHtml(card.text)}</div>
        </div>`;
      setupRollingCaption(card);
    }

    function renderScrollingText(card) {
      content.innerHTML = `
        ${factPinMarkup(card)}
        ${evidenceMarkup(card)}
        ${card.displayText ? `<div class="text center tail-display-text">${escapeHtml(card.displayText)}</div>` : ""}
        <div class="rolling-caption" aria-label="正文字幕">
          <div class="rolling-caption-text">${escapeHtml(card.text)}</div>
        </div>`;
      setupRollingCaption(card);
    }

    function setupRollingCaption(card) {
      const windowEl = content.querySelector(".rolling-caption");
      const textEl = content.querySelector(".rolling-caption-text");
      if (!windowEl || !textEl) return;
      window.requestAnimationFrame(() => {
        const distance = Math.max(0, textEl.scrollHeight - windowEl.clientHeight);
        textEl.style.setProperty("--scroll-distance", `${distance}px`);
        textEl.style.setProperty("--scroll-duration", `${card.fixed || durationFor(card)}ms`);
        textEl.classList.toggle("is-scrolling", distance > 0);
      });
    }

    function render(card) {
      clearTimeout(timer);
      clearFinalStopTimer();
      stopAudio();   // stops narration + oscillators; bed & bgm persist
      updateProgress();
      setImage(card);
      const contentClasses = ["content"];
      if (screenPage(card) && !hideVisualText(card)) contentClasses.push("screen-card");
      if (card.kind === "photo" || card.scrollText) contentClasses.push("photo-card");
      if (card.displayText) contentClasses.push("dual-caption");
      if (evidenceMarkup(card)) contentClasses.push("evidence-host");
      content.className = contentClasses.join(" ");
      content.dataset.cardId = card.id || "";

      // ── 声音路由 ──────────────────────────────────────────────
      const bedType = card.bed;
      if (bedType === "fan" || bedType === "street") {
        startBed(bedType);
      } else if (bedType === "silence") {
        stopBed();
      } else if (bedType === undefined) {
        // no change to bed
      } else {
        stopBed();
      }

      const soundType = card.sound;
      if (soundType === "silence" || soundType === undefined) {
        stopSoundscape();
      } else {
        startSoundscape(soundType);    // oscillator for drop / thin
      }

      if (card.bgm === "warm-low") {
        startBgm("warmLow");
      } else {
        stopBgm();
      }

      // ── sfx 一次性音效 ────────────────────────────────────────
      playSfx(card.sfx);

      if (card.pause) {
        content.innerHTML = `
          ${visualMarkup(card.visual)}
          <div class="choice-grid" aria-label="两个身体声音触发器">
            <button class="visual-choice" id="btn-reach">
              <div class="choice-scene">${pauseImageMarkup("reach")}</div>
              <div class="choice-copy"><strong>把身子送出去</strong></div>
            </button>
            <button class="visual-choice" id="btn-still">
              <div class="choice-scene">${pauseImageMarkup("still")}</div>
              <div class="choice-copy"><strong>真的不想动</strong></div>
            </button>
          </div>`;
        content.querySelectorAll(".visual-choice").forEach(btn => {
          btn.addEventListener("click", () => handlePauseTrigger(card));
        });
        return;
      }

      if (card.kind === "photo") {
        renderPhoto(card);
      } else if (card.scrollText) {
        renderScrollingText(card);
      } else if (card.kind === "night-tail") {
        renderNightTail(card);
      } else if (card.kind === "day-start") {
        renderDayStart(card);
      } else if (card.visual) {
        renderVisual(card);
      } else {
        const cls = `text ${card.kind==="center"?"center":"small"}`;
        content.innerHTML = `
          ${captionMarkup(card)}
          ${pageMarkup(card)}
          ${textMarkup(card, cls)}`;
      }

      const hasAudio = playAudio(card, ok => {
        if (ok) { timer = window.setTimeout(next, 900); }
        else     { schedule(card); }
        scheduleFinalStop(card);
      });
      if (!hasAudio) schedule(card);
      scheduleFinalStop(card);
    }

    function next(force = false) {
      if (!running) return;
      if (index >= cards.length - 1) return;
      const now = Date.now();
      if (!force && now - lastAdvanceAt < 700) return;
      lastAdvanceAt = now;
      index = Math.min(index + 1, cards.length - 1);
      render(cards[index]);
    }

    function handlePauseTrigger(card) {
      content.querySelectorAll(".visual-choice").forEach(btn => {
        btn.disabled = true;
      });

      const sequence = ["reach", "still", "reach", "still", "freeze"];
      let frame = 0;
      const renderFrame = () => {
        const view = sequence[frame];
        content.innerHTML = `
          <div class="pause-animation">${pauseImageMarkup(view)}</div>`;
        if (frame < sequence.length - 1) {
          frame += 1;
          timer = window.setTimeout(renderFrame, 600);
        } else {
          timer = window.setTimeout(() => jumpTo("card-11"), 500);
        }
      };
      renderFrame();
    }

    function jumpTo(id) {
      clearFinalStopTimer();
      const nextIndex = cards.findIndex(c => c.id === id);
      index   = nextIndex >= 0 ? nextIndex : 0;
      running = true;
      paused  = false;
      cover.style.display = "none";
      render(cards[index]);
    }

    function start() {
      clearFinalStopTimer();
      primeAudio();
      running = true;
      paused  = false;
      cover.style.display = "none";
      index   = 0;
      render(cards[index]);
    }

    function primeAudio() {
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") audioContext.resume().catch(()=>{});
      const silentWav = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAACAgICA";
      const primer = new Audio(silentWav);
      primer.volume = 0;
      primer.play().then(() => primer.pause()).catch(()=>{});
    }

    function pause() {
      if (!running || paused) return;
      paused = true;
      clearTimeout(timer);
      clearFinalStopTimer();
      if (activeAudio) activeAudio.pause();
      if (bedAudio)    bedAudio.pause();
      if (bgmAudio)    bgmAudio.pause();
      phone.classList.add("paused");
    }

    function resume() {
      if (!running || !paused) return;
      paused = false;
      phone.classList.remove("paused");
      if (activeAudio) activeAudio.play().catch(()=>{});
      if (bedAudio)    bedAudio.play().catch(()=>{});
      if (bgmAudio)    bgmAudio.play().catch(()=>{});
      if (!activeAudio) schedule(cards[index]);
      if (!activeAudio) scheduleFinalStop(cards[index]);
    }

    startBtn.addEventListener("click", start);

    voiceToggle.addEventListener("click", e => {
      e.stopPropagation();
      voiceSet = voiceSet === "A" ? "B" : "A";
      voiceToggle.textContent = voiceSet;
    });

    [voiceToggle, soundRetry].forEach(control => {
      ["pointerdown", "pointerup", "click"].forEach(type => {
        control.addEventListener(type, event => event.stopPropagation());
      });
    });

    soundRetry.addEventListener("click", () => {
      const card = pendingAudioCard;
      if (!card || card !== cards[index]) {
        soundRetry.hidden = true;
        return;
      }
      clearTimeout(timer);
      soundRetry.hidden = true;
      primeAudio();
      const hasAudio = playAudio(card, ok => {
        if (ok) timer = window.setTimeout(next, 900);
        else schedule(card);
      });
      if (!hasAudio) schedule(card);
    });

    phone.addEventListener("pointerdown", () => {
      touchMoved = false;
      longPressTriggered = false;
      pressTimer = window.setTimeout(() => {
        longPressTriggered = true;
        pause();
      }, 520);
    });
    phone.addEventListener("pointermove", () => { touchMoved=true; clearTimeout(pressTimer); });
    phone.addEventListener("pointerup",   () => {
      clearTimeout(pressTimer);
      if (!running || touchMoved) return;
      if (longPressTriggered) return;
      if (paused) { resume(); return; }
      const card = cards[index];
      if (!card.pause) next();
    });
    phone.addEventListener("pointerleave", () => clearTimeout(pressTimer));

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) pause();
    });
    window.addEventListener("pagehide", pause);
  </script>
</body>
</html>
