<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>人生馆001号｜2011，那只水杯</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080807;
      --panel: #11110f;
      --ink: #f2eadb;
      --muted: #b9ad99;
      --cold: #6d8aa4;
      --warm: #d5aa63;
      --line: rgba(255,255,255,.14);
      --shadow: 0 24px 70px rgba(0,0,0,.55);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(129,111,76,.22), transparent 36%),
        linear-gradient(180deg, #171512 0%, #070707 78%);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      overflow: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.07);
      cursor: pointer;
    }

    .app {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .phone {
      width: min(420px, calc(100vw - 28px));
      height: min(820px, calc(100vh - 28px));
      min-height: 640px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 28px;
      background: #0c0c0b;
      box-shadow: var(--shadow);
      isolation: isolate;
      user-select: none;
      touch-action: manipulation;
    }

    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(11,13,16,.1), rgba(0,0,0,.58)),
        #111;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--image);
      background-size: cover;
      background-position: center;
      opacity: var(--image-opacity, .88);
      transform: scale(1.03);
      transition: opacity .45s ease, filter .45s ease;
      filter: saturate(.82) contrast(1.05) brightness(.82);
      z-index: -2;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 58%, transparent 0 28%, rgba(0,0,0,.54) 76%),
        linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.72));
      z-index: -1;
    }

    .stage.cold::after {
      background:
        radial-gradient(circle at 50% 60%, transparent 0 22%, rgba(0,0,0,.62) 76%),
        linear-gradient(180deg, rgba(12,26,43,.22), rgba(0,0,0,.76));
    }

    .stage.warm::after {
      background:
        radial-gradient(circle at 50% 60%, rgba(214,166,84,.08), transparent 34%, rgba(0,0,0,.55) 78%),
        linear-gradient(180deg, rgba(20,14,7,.14), rgba(0,0,0,.68));
    }

    .hud {
      position: absolute;
      inset: 16px 16px auto;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .progress {
      height: 3px;
      flex: 1;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.16);
    }

    .progress span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cold), var(--warm));
      transition: width .28s ease;
    }

    .sound-toggle {
      width: 42px;
      height: 28px;
      border-radius: 99px;
      background: rgba(0,0,0,.28);
      color: var(--muted);
      font-size: 12px;
      pointer-events: auto;
    }

    .content {
      position: absolute;
      inset: 0;
      display: grid;
      align-content: end;
      gap: 18px;
      padding: 70px 26px 38px;
      z-index: 2;
    }

    .content > :not(.micro-scene) {
      position: relative;
      z-index: 1;
    }

    .kicker {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0;
    }

    .title {
      font-size: 30px;
      line-height: 1.16;
      font-weight: 700;
      text-wrap: balance;
    }

    .text {
      white-space: pre-line;
      font-size: 24px;
      line-height: 1.45;
      font-weight: 650;
      text-shadow: 0 2px 18px rgba(0,0,0,.72);
      text-wrap: balance;
    }

    .text.small {
      font-size: 19px;
      line-height: 1.62;
      font-weight: 560;
    }

    .text.center {
      align-self: center;
      text-align: center;
      font-size: 30px;
      line-height: 1.35;
    }

    .caption {
      display: inline-block;
      width: fit-content;
      max-width: 100%;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 6px;
      background: rgba(0,0,0,.38);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .choice {
      width: 100%;
      min-height: 56px;
      padding: 13px 14px;
      border-radius: 8px;
      text-align: left;
      background: rgba(10,10,9,.72);
      backdrop-filter: blur(10px);
      line-height: 1.35;
    }

    .choice:active { transform: translateY(1px); }

    .cover {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      align-content: end;
      gap: 18px;
      padding: 40px 28px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.7)),
        url("assets/img/cover.jpg") center / cover;
    }

    .primary {
      width: 100%;
      min-height: 54px;
      border-radius: 8px;
      background: #f0d5a6;
      color: #1b130b;
      border: 0;
      font-weight: 700;
    }

    .secondary {
      width: 100%;
      min-height: 46px;
      border-radius: 8px;
      background: rgba(0,0,0,.42);
      color: #efe3cf;
      font-size: 14px;
    }

    .muted-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 0;
    }

    .cover-hook {
      margin: 0;
      color: #f3dfb8;
      font-size: 20px;
      line-height: 1.45;
      font-weight: 650;
      text-shadow: 0 2px 18px rgba(0,0,0,.72);
      text-wrap: balance;
    }

    .paused .hint { opacity: 1; }

    .hint {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 8;
      transform: translate(-50%, -50%);
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(0,0,0,.72);
      color: var(--muted);
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }

    .photo-stack {
      align-self: center;
      display: grid;
      gap: 12px;
      margin-bottom: 12px;
    }

    .photo-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .photo-row img,
    .photo-main {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.16);
      filter: saturate(.86) contrast(1.04);
    }

    .photo-main { max-height: 360px; }

    .truth-note {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px;
      background: rgba(0,0,0,.45);
    }

    .micro-scene {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 24%, rgba(32,61,88,.32), transparent 34%),
        linear-gradient(180deg, #101112 0%, #070707 70%);
    }

    .micro-scene::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 14%;
      width: 68%;
      height: 26%;
      transform: translateX(-50%);
      border: 1px solid rgba(121,162,196,.2);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(80,135,188,.58), rgba(20,31,43,.78)),
        repeating-linear-gradient(0deg, transparent 0 18px, rgba(255,255,255,.06) 18px 19px);
      box-shadow: 0 0 52px rgba(74,126,180,.28);
      opacity: .62;
    }

    .desk {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56%;
      background:
        radial-gradient(ellipse at 56% 18%, rgba(255,255,255,.07), transparent 22%),
        linear-gradient(150deg, #32281e, #15110d 72%);
      transform: perspective(520px) rotateX(5deg);
      transform-origin: bottom;
      box-shadow: inset 0 26px 60px rgba(0,0,0,.46);
    }

    .mess {
      position: absolute;
      border-radius: 6px;
      background: rgba(185,169,132,.16);
      box-shadow: 0 8px 22px rgba(0,0,0,.38);
    }

    .mess.m1 { width: 86px; height: 54px; left: 12%; bottom: 24%; transform: rotate(-8deg); }
    .mess.m2 { width: 62px; height: 84px; right: 16%; bottom: 26%; transform: rotate(11deg); }
    .mess.m3 { width: 96px; height: 18px; left: 30%; bottom: 17%; transform: rotate(4deg); }
    .ash {
      position: absolute;
      left: 20%;
      bottom: 36%;
      width: 72px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle, #5a5146, #171310 72%);
      box-shadow: inset 0 0 16px rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.46);
    }

    .cup {
      position: absolute;
      right: 17%;
      bottom: 32%;
      width: 58px;
      height: 78px;
      border-radius: 9px 9px 18px 18px;
      background:
        radial-gradient(ellipse at 48% 16%, rgba(120,96,65,.9), rgba(25,22,18,.98) 56%),
        linear-gradient(90deg, #0b0a09, #2a211a 52%, #080706);
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: 0 18px 38px rgba(0,0,0,.62);
    }

    .cup::after {
      content: "";
      position: absolute;
      inset: 10px 10px auto auto;
      width: 16px;
      height: 42px;
      border-radius: 12px;
      border: 5px solid rgba(59,45,31,.76);
      border-left: 0;
      transform: translateX(18px);
    }

    .hand {
      position: absolute;
      left: 21%;
      bottom: 23%;
      width: 34%;
      height: 58px;
      border-radius: 40px 26px 22px 40px;
      background: linear-gradient(90deg, #5b3b29, #a97958 76%, #c69471);
      box-shadow: 0 12px 36px rgba(0,0,0,.55);
      transform-origin: left center;
    }

    .hand::after {
      content: "";
      position: absolute;
      right: -20px;
      top: 10px;
      width: 48px;
      height: 14px;
      border-radius: 99px;
      background: #c69471;
      box-shadow:
        0 12px 0 #b98766,
        0 24px 0 #a87658;
    }

    .distance-mark {
      position: absolute;
      left: 54%;
      right: 32%;
      bottom: 38%;
      border-top: 1px dashed rgba(244,224,190,.44);
      opacity: 0;
    }

    .micro-screen .desk { filter: blur(.6px) brightness(.68); }
    .micro-desk::before { opacity: .48; }
    .micro-reach .hand { transform: translateX(22%) rotate(-3deg); }
    .micro-reach .distance-mark { opacity: 1; }
    .micro-freeze .hand { transform: translateX(24%) rotate(-3deg); animation: tremble 1.8s infinite; }
    .micro-freeze .distance-mark { opacity: 1; }
    .micro-still .hand { transform: translateX(-5%) rotate(1deg); opacity: .84; }
    .micro-abyss {
      background: radial-gradient(circle at 50% 30%, rgba(49,76,98,.16), transparent 22%), #010101;
    }
    .micro-abyss::before,
    .micro-abyss .desk,
    .micro-abyss .mess,
    .micro-abyss .ash,
    .micro-abyss .cup,
    .micro-abyss .hand,
    .micro-abyss .distance-mark { opacity: 0; }

    @keyframes tremble {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(.88); }
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* 停顿〇触发器：沿用按钮类名，语义是身体声音，不是剧情分支。 */
    .visual-choice {
      min-height: 176px;
      padding: 0;
      overflow: hidden;
      border-radius: 8px;
      background: rgba(0,0,0,.72);
      text-align: left;
    }

    .visual-choice:disabled {
      opacity: .64;
      cursor: default;
    }

    .choice-scene {
      position: relative;
      height: 110px;
      overflow: hidden;
      background: #090909;
    }

    .choice-scene .micro-scene {
      transform: scale(.72);
      transform-origin: center;
      inset: -50px -62px;
    }

    .choice-copy {
      display: grid;
      gap: 3px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.28;
    }

    .choice-copy strong { font-size: 16px; }

    .pause-animation {
      position: relative;
      min-height: 220px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      background: #050505;
    }

    @media (max-width: 430px) {
      .app { padding: 0; }
      .phone {
        width: 100vw;
        height: 100vh;
        min-height: 100vh;
        border-radius: 0;
        border: 0;
      }
      .content { padding: 64px 22px 34px; }
      .title { font-size: 28px; }
      .text { font-size: 22px; }
      .text.small { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="phone" id="phone">
      <div class="stage" id="stage"></div>
      <div class="hud">
        <div class="progress"><span id="progressBar"></span></div>
        <button class="sound-toggle" id="voiceToggle" aria-label="切换旁白声线">A</button>
      </div>
      <div class="content" id="content"></div>
      <div class="hint">已暂停</div>
      <div class="cover" id="cover">
        <div class="kicker">人生馆001号</div>
        <div class="title">2011，那只水杯</div>
        <p class="cover-hook">他一直觉得这样挺好——直到那只水杯，让他看见自己一动没动。</p>
        <p class="muted-note">竖屏有声卡片流 v1.1。点击可加速，长按暂停。</p>
        <button class="primary" id="startBtn">开始</button>
        <button class="secondary" id="sampleBtn">直接试水杯段</button>
      </div>
    </section>
  </main>

  <script>
    const voiceSets = {
      A: "assets/audio/narration-A/",
      B: "assets/audio/narration-B/"
    };

    let voiceSet = "A";

    // ─── sfx 路径 ───────────────────────────────────────────────
    const SFX = {
      "pack-up":    "assets/audio/sfx/pack-up.mp3",
      "open-up":    "assets/audio/sfx/open-up.mp3",
      "qq":         "assets/audio/sfx/qq.mp3",
      "drop-tone":  "assets/audio/sfx/drop-tone.mp3",
      "single-tone":"assets/audio/sfx/single-tone.mp3",
      "pen":        "assets/audio/sfx/pen.mp3",
      "money":      "assets/audio/sfx/money.mp3",
    };

    // ─── bed / bgm 路径 ──────────────────────────────────────────
    const BED_FILES = {
      fan:    "assets/audio/bed-fan.mp3",
      street: "assets/audio/bed-street.mp3",
    };
    const BGM_FILE = "assets/audio/bgm-warm.mp3";

    const cards = [
      { id: "cover",   kind: "center", mood: "cold", img: "assets/img/cover.jpg", text: "2011年。\n长沙，红花坡。", fixed: 3600 },
      { id: "card-01", img: "assets/img/card-01-v11.png", caption: "夜尾", text: "凌晨三四点。屏上片子停在最后一帧，吊扇还在转。", fixed: 5200,
        sfx: ["pack-up"] },
      { id: "card-02", mood: "cold", img: "assets/img/card-02-v11.png", audio: "card-02.mp3", text: "又是下午两三点。\n外面夜宵摊开张，你的一天，也开张了。",
        sfx: ["open-up"] },
      { id: "card-03", mood: "cold", img: "assets/img/card-03-v11.png", audio: "card-03.mp3", text: "主角从谷底爬起来，打怪，变强，封神。\n又一章。还是昨天那本。" },
      { id: "card-04", mood: "cold", img: "assets/img/card-04-v11.png", audio: "card-04.mp3", text: "你最爱看的，是那种到最后才发现“原来全错了”的片子。" },
      { id: "card-05", mood: "cold", img: "assets/img/card-05-v11.png", audio: "card-05.mp3", text: "有一部片子你一直忘不掉。\n一个人坚信不疑的东西，真相却完全反过来。\n你刚写完它的影评，挂在网上。" },
      { id: "card-06", mood: "cold", img: "assets/img/card-06-v11.png", audio: "card-06.mp3", text: "同在这座长沙城里，同学们有房有车，孩子都上小学了。\n你住在白天也拉着帘的老破小里。",
        sfx: ["qq"] },
      { id: "card-07", mood: "cold", img: "assets/img/card-07-v11.png", audio: "card-07.mp3", text: "这话，你写在影评里，也跟自己说了很多遍。\n说到，你自己都信了。" },

      { id: "card-08",  mood: "cold", img: "assets/img/card-08-v11.png",  sound: "fan", caption: "屏外", text: "屏幕还亮着。\n封神、逆袭、挺好。\n视线从屏上移开。", fixed: 5200 },
      { id: "card-08b", mood: "cold", img: "assets/img/card-08-v11.png",  sound: "fan", caption: "桌面", text: "烟灰、泡面桶、纸巾团。\n蓝光打在这一桌黏腻上。", fixed: 4800 },
      { id: "card-09",  mood: "cold", img: "assets/img/card-09-v11.png",  sound: "fan", caption: "口渴", text: "桌角那只黑旧的杯子。\n手，下意识探过去。", fixed: 4600 },
      { id: "card-10",  mood: "cold", img: "assets/img/card-10-v11.png",  sound: "thin", caption: "二三拳头", text: "还差一点。\n不是一指头，是二三拳头。\n要够着，得把整个身子送出去。", fixed: 6200 },
      {
        id: "pause-0",
        pause: true,
        mood: "cold",
        visual: "freeze",
        sound: "silence",
        title: "那一下。",
        text: "身体里，两个声音。",
        // 停顿〇=两个身体声音的触发器，非真假分支。点任一键只触发"交替二次→卡住"，结局由事实锁定：身子没有动(card-11)。顺序锁：card-11→card-12(饼女人)不得前置。
        voices: [
          { label: "把身子送出去", view: "reach" },
          { label: "真的不想动", view: "still" }
        ]
      },
      { id: "card-11", mood: "cold", img: "assets/img/card-11-v11.png", sound: "silence", audio: "card-11.mp3", text: "手缩回去了。\n\n身子，没有动。", fixed: 4200 },
      { id: "card-12", mood: "cold", img: "assets/img/card-12-v11.png", sound: "drop",    audio: "card-12.mp3", text: "一个画面毫无来由地冒出来。\n那个妇人，丈夫把大饼挂在她脖子上出了远门。\n她饿死了。\n因为懒得把饼转过来。", fixed: 9800,
        sfx: ["drop-tone"] },
      { id: "card-13", mood: "cold", img: "assets/img/card-13-v11.png", sound: "drop",    text: "", fixed: 4800 },
      { id: "card-14", mood: "cold", img: "assets/img/card-14-v11.png", sound: "silence", audio: "card-14.mp3", text: "就这么停着。\n\n大概，一分钟。", fixed: 5200 },
      { id: "card-15", kind: "center", mood: "cold", img: "assets/img/card-15-v11.png", sound: "silence", audio: "card-15.mp3", text: "再也不能这样过下去了！\n\n绝对不行！！！", fixed: 6200 },

      { id: "card-16", mood: "warm", img: "assets/img/card-16-v11.png", text: "醒过来，你没急着怪外面没机会。\n你一条条算过：上班，没人请；下力气，那点清高过不去；再倒腾软件，还是养不活自己。\n不是没路，是我把自己关在屋里，根本没出去。", fixed: 11200 },
      { id: "card-17a", mood: "warm", img: "assets/img/card-17-v11.png", text: "那就先把这个根解决：出去，动起来。\n你脑子里翻出一张牌：村里那个大哥。\n没读过几年书，伙着三四个人，把一笔信托对接给房地产，募了六千万。\n一个点，六十万到手。", fixed: 11600 },
      { id: "card-17b", mood: "warm", img: "assets/img/card-17-v11.png", text: "你心里那笔账清清楚楚：\n他没读过几年书都能做成；我上过学，会电脑，会上网。\n凭什么我不行？\n你想的不是“我要像他”，是：他能，这条路就走得通，那我也能。", fixed: 11800 },
      { id: "card-18", kind: "center", mood: "warm", img: "assets/img/card-18-v11.png", text: "前面全是荆棘，你也看不清。\n但你认了：先动，先试了再说。\n砍开一点，往前挪一点；又挡住了，再砍。",
        sfx: ["single-tone"], fixed: 9800 },
      { id: "card-18b", mood: "warm", img: "assets/img/card-18-v11.png", text: "刀往哪砍？\n你把百度当老师，一个词一个词地啃：承兑、信托、资金方。\n然后线上线下，一家家对接。\n头两单，真成了，挣了五六万。", fixed: 11200 },
      { id: "card-19", mood: "warm", img: "assets/img/card-19-v11.png", text: "你兜里揣个小本子，前几页抄满要点。\n生怕哪个词没懂，被人看出是新来的。\n沿街一家家，仰头把招牌上的电话抄进手机。\n回去一条条群发：老板，我做承兑业务的。",
        sfx: ["pen"], fixed: 11600 },
      { id: "card-20", mood: "warm", img: "assets/img/card-20-v11.png", text: "跑了不知多少家，第一单来了。\n三百万的承兑，你带着资金方做成。\n他赚了万把块，甩给你一张一百块：带路费。\n你心里只有一个念头：我还成单了。\n路，砍开了第一道口子。",
        sfx: ["money"], fixed: 11800 },

      {
        id: "card-21",
        mood: "cold",
        kind: "photo",
        img: "assets/img/card21-photo.png",
        frog: "assets/img/card21-frog.png",
        audioFull: "assets/audio/card21.m4a",
        fixed: 93653,
        text: "那个下午，到今天，十五年了。\n现在想起，还是从背脊升起一种没来由的恐惧。\n可怕的是当时一点都不觉得自己有问题。\n那是被自己吓醒的。"
      },
      {
        id: "card-22",
        kind: "center",
        mood: "warm",
        img: "assets/img/tail.jpg",
        text: "我们其实都有过这样的时刻。\n以为自己跟别人不一样，看得更透，活得更不同。\n其实，只是给自己找了一个很完美的理由，而且自己完全不觉得哪里不对。",
        fixed: 8600
      }
    ];

    const stage      = document.getElementById("stage");
    const content    = document.getElementById("content");
    const cover      = document.getElementById("cover");
    const startBtn   = document.getElementById("startBtn");
    const sampleBtn  = document.getElementById("sampleBtn");
    const progressBar= document.getElementById("progressBar");
    const phone      = document.getElementById("phone");
    const voiceToggle= document.getElementById("voiceToggle");

    let index       = 0;
    let timer       = null;
    let activeAudio = null;
    let running     = false;
    let paused      = false;
    let pressTimer  = null;
    let touchMoved  = false;
    let audioContext= null;
    let soundNodes  = [];

    // ─── Bed / BGM state ────────────────────────────────────────
    let bedAudio       = null;
    let bgmAudio       = null;
    let currentBedType = null;   // tracks running bed type to avoid restarts
    let bgmRunning     = false;

    // ─── Helpers ────────────────────────────────────────────────
    function escapeHtml(v) {
      return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function setImage(card) {
      stage.classList.toggle("has-visual", !!(card && card.visual));
      stage.style.setProperty("--image", card && card.img ? `url("${card.img}")` : "none");
      stage.classList.toggle("cold", card && card.mood === "cold");
      stage.classList.toggle("warm", card && card.mood === "warm");
    }

    // ─── Oscillator soundscape (unchanged, for drop / thin) ─────
    function stopSoundscape() {
      soundNodes.forEach(n => { try { if(n.stop) n.stop(); if(n.disconnect) n.disconnect(); } catch(e){} });
      soundNodes = [];
    }

    function startSoundscape(type) {
      stopSoundscape();
      // fan / street are handled by file-based bed; silence = nothing
      if (!type || type === "silence" || type === "fan" || type === "street") return;
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") audioContext.resume().catch(()=>{});
      const gain = audioContext.createGain();
      gain.gain.value = type === "drop" ? 0.03 : type === "thin" ? 0.018 : 0.026;
      gain.connect(audioContext.destination);
      const osc = audioContext.createOscillator();
      osc.type = "sine";
      osc.frequency.value = type === "drop" ? 48 : type === "thin" ? 82 : 66;
      osc.connect(gain); osc.start();
      soundNodes.push(osc, gain);
      if (type === "drop") {
        const lfoGain = audioContext.createGain();
        const lfo = audioContext.createOscillator();
        lfo.frequency.value = 0.55; lfoGain.gain.value = 11;
        lfo.connect(lfoGain); lfoGain.connect(osc.frequency); lfo.start();
        soundNodes.push(lfo, lfoGain);
      }
    }

    // ─── File-based bed ─────────────────────────────────────────
    function startBed(type) {
      if (type === currentBedType) return;   // already playing this bed
      currentBedType = type;

      if (bedAudio) { bedAudio.pause(); bedAudio = null; }

      const src = BED_FILES[type];
      if (!src) return;

      const a = new Audio(src);
      a.loop   = true;
      a.volume = 0.14;
      bedAudio = a;
      a.play().catch(() => {
        // fallback: oscillator hum
        startSoundscape(type);
      });
    }

    function stopBed() {
      currentBedType = null;
      if (bedAudio) { bedAudio.pause(); bedAudio = null; }
    }

    // ─── BGM ────────────────────────────────────────────────────
    function startBgm() {
      if (bgmRunning) return;
      bgmRunning = true;
      const a = new Audio(BGM_FILE);
      a.loop   = true;
      a.volume = 0.09;
      bgmAudio = a;
      a.play().catch(() => {});
    }

    function stopBgm() {
      bgmRunning = false;
      if (bgmAudio) { bgmAudio.pause(); bgmAudio = null; }
    }

    // ─── SFX one-shot ───────────────────────────────────────────
    function playSfx(keys) {
      if (!keys || !keys.length) return;
      keys.forEach(key => {
        const src = SFX[key];
        if (!src) return;
        const a = new Audio(src);
        a.volume = 0.68;
        a.play().catch(() => {});
      });
    }

    // ─── Audio lifecycle ────────────────────────────────────────
    function stopAudio() {
      if (activeAudio) { activeAudio.pause(); activeAudio = null; }
      stopSoundscape();
      // NOTE: bed and bgm are NOT stopped here; they persist across cards
    }

    function stopAllAudio() {
      stopAudio();
      stopBed();
      stopBgm();
    }

    function durationFor(card) {
      if (card.fixed) return card.fixed;
      const chars = (card.text||"").replace(/\s/g,"").length;
      return Math.max(3800, Math.min(12000, 2200 + chars * 180));
    }

    function progressValue() {
      const playable = cards.filter(c => !c.pause).length;
      const played   = cards.slice(0, index + 1).filter(c => !c.pause).length;
      return Math.min(100, Math.max(0, (played / playable) * 100));
    }

    function updateProgress() {
      progressBar.style.width = `${progressValue()}%`;
    }

    function playAudio(card, done) {
      if (activeAudio) { activeAudio.pause(); activeAudio = null; }
      const src = card.audioFull || (card.audio ? `${voiceSets[voiceSet]}${card.audio}` : "");
      if (!src) return false;
      const audio = new Audio(src);
      activeAudio = audio;
      let settled = false;
      const fallback = () => { if (settled || audio !== activeAudio) return; settled=true; done(false); };
      audio.addEventListener("ended", () => { if (settled || audio !== activeAudio) return; settled=true; done(true); });
      audio.addEventListener("error", fallback, { once: true });
      audio.play().catch(fallback);
      return true;
    }

    function schedule(card) {
      clearTimeout(timer);
      if (!running || paused || card.pause || index >= cards.length - 1) return;
      timer = window.setTimeout(next, durationFor(card));
    }

    function visualMarkup(name) {
      if (name === "black") return "";
      const cls = { screen:"micro-screen", desk:"micro-desk", cup:"micro-cup",
        reach:"micro-reach", freeze:"micro-freeze", still:"micro-still", abyss:"micro-abyss" }[name] || "micro-desk";
      return `<div class="micro-scene ${cls}" aria-hidden="true">
        <div class="desk"></div><div class="mess m1"></div><div class="mess m2"></div>
        <div class="mess m3"></div><div class="ash"></div><div class="cup"></div>
        <div class="hand"></div><div class="distance-mark"></div></div>`;
    }

    function renderVisual(card) {
      content.innerHTML = `
        ${visualMarkup(card.visual)}
        ${card.caption ? `<div class="caption">${escapeHtml(card.caption)}</div>` : ""}
        <div class="text ${card.kind==="center"?"center":"small"}">${escapeHtml(card.text)}</div>`;
    }

    function renderPhoto(card) {
      content.innerHTML = `
        <div class="photo-stack">
          <img class="photo-main" src="${escapeHtml(card.img)}" alt="">
          <div class="photo-row">
            <img src="${escapeHtml(card.frog)}" alt="">
            <div class="truth-note">
              <div class="kicker">真人真声</div>
              <div class="caption">无 AI 克隆。保留停顿、不顺和口语节奏。</div>
            </div>
          </div>
        </div>
        <div class="text small">${escapeHtml(card.text)}</div>`;
    }

    function render(card) {
      clearTimeout(timer);
      stopAudio();   // stops narration + oscillators; bed & bgm persist
      updateProgress();
      setImage(card);

      // ── 声音路由 ──────────────────────────────────────────────
      const soundType = card.sound;
      if (soundType === "fan" || soundType === "street") {
        startBed(soundType);
      } else if (soundType === "silence") {
        stopBed();
        stopSoundscape();
      } else if (soundType === undefined) {
        // no change to bed
      } else {
        stopBed();
        startSoundscape(soundType);    // oscillator for drop / thin
      }

      if (card.mood === "warm") {
        startBgm();
      } else if (card.mood === "cold") {
        stopBgm();
      }

      // ── sfx 一次性音效 ────────────────────────────────────────
      playSfx(card.sfx);

      if (card.pause) {
        const voices = card.voices || [];
        content.innerHTML = `
          ${visualMarkup(card.visual)}
          <div class="kicker">${escapeHtml(card.title)}</div>
          <div class="text small">${escapeHtml(card.text)}</div>
          <div class="choice-grid" aria-label="两个身体声音触发器">
            ${voices.map((voice,i)=>`
              <button class="visual-choice" data-trigger="${i}">
                <div class="choice-scene">${visualMarkup(voice.view)}</div>
                <div class="choice-copy"><strong>${escapeHtml(voice.label)}</strong></div>
              </button>`).join("")}
          </div>`;
        content.querySelectorAll(".visual-choice").forEach((btn, i) => {
          btn.addEventListener("click", () => handlePauseTrigger(card));
        });
        return;
      }

      if (card.kind === "photo") {
        renderPhoto(card);
      } else if (card.visual) {
        renderVisual(card);
      } else {
        const cls = `text ${card.kind==="center"?"center":"small"}`;
        content.innerHTML = `
          ${card.caption ? `<div class="caption">${escapeHtml(card.caption)}</div>` : ""}
          <div class="${cls}">${escapeHtml(card.text)}</div>`;
      }

      const hasAudio = playAudio(card, ok => {
        if (ok) { timer = window.setTimeout(next, 900); }
        else     { schedule(card); }
      });
      if (!hasAudio) schedule(card);
    }

    function next() {
      if (!running) return;
      if (index >= cards.length - 1) return;
      index = Math.min(index + 1, cards.length - 1);
      render(cards[index]);
    }

    function handlePauseTrigger(card) {
      content.querySelectorAll(".visual-choice").forEach(btn => {
        btn.disabled = true;
      });

      const sequence = ["reach", "still", "reach", "still", "freeze"];
      let frame = 0;
      const renderFrame = () => {
        const view = sequence[frame];
        content.innerHTML = `
          <div class="kicker">${escapeHtml(card.title)}</div>
          <div class="text small">${escapeHtml(frame < sequence.length - 1 ? card.text : "")}</div>
          <div class="pause-animation">${visualMarkup(view)}</div>`;
        if (frame < sequence.length - 1) {
          frame += 1;
          timer = window.setTimeout(renderFrame, 400);
        } else {
          timer = window.setTimeout(() => jumpTo("card-11"), 600);
        }
      };
      renderFrame();
    }

    function jumpTo(id) {
      const nextIndex = cards.findIndex(c => c.id === id);
      index   = nextIndex >= 0 ? nextIndex : 0;
      running = true;
      paused  = false;
      cover.style.display = "none";
      render(cards[index]);
    }

    function start() {
      running = true;
      paused  = false;
      cover.style.display = "none";
      index   = 0;
      render(cards[index]);
    }

    function pause() {
      if (!running || paused) return;
      paused = true;
      clearTimeout(timer);
      if (activeAudio) activeAudio.pause();
      if (bedAudio)    bedAudio.pause();
      if (bgmAudio)    bgmAudio.pause();
      phone.classList.add("paused");
    }

    function resume() {
      if (!running || !paused) return;
      paused = false;
      phone.classList.remove("paused");
      if (activeAudio) activeAudio.play().catch(()=>{});
      if (bedAudio)    bedAudio.play().catch(()=>{});
      if (bgmAudio)    bgmAudio.play().catch(()=>{});
      if (!activeAudio) schedule(cards[index]);
    }

    startBtn.addEventListener("click", start);
    sampleBtn.addEventListener("click", () => jumpTo("card-08"));

    voiceToggle.addEventListener("click", e => {
      e.stopPropagation();
      voiceSet = voiceSet === "A" ? "B" : "A";
      voiceToggle.textContent = voiceSet;
    });

    phone.addEventListener("pointerdown", () => { touchMoved=false; pressTimer=window.setTimeout(pause,520); });
    phone.addEventListener("pointermove", () => { touchMoved=true; clearTimeout(pressTimer); });
    phone.addEventListener("pointerup",   () => {
      clearTimeout(pressTimer);
      if (!running || touchMoved) return;
      if (paused) { resume(); return; }
      const card = cards[index];
      if (!card.pause) next();
    });
    phone.addEventListener("pointerleave", () => clearTimeout(pressTimer));
  </script>
</body>
</html>
