<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>人生馆001号｜2011，那只水杯</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080807;
      --panel: #11110f;
      --ink: #f2eadb;
      --muted: #b9ad99;
      --cold: #6d8aa4;
      --warm: #d5aa63;
      --line: rgba(255,255,255,.14);
      --shadow: 0 24px 70px rgba(0,0,0,.55);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(129,111,76,.22), transparent 36%),
        linear-gradient(180deg, #171512 0%, #070707 78%);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      overflow: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.07);
      cursor: pointer;
    }

    .app {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .phone {
      width: min(420px, calc(100vw - 28px));
      height: min(820px, calc(100vh - 28px));
      min-height: 640px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 28px;
      background: #0c0c0b;
      box-shadow: var(--shadow);
      isolation: isolate;
      user-select: none;
      touch-action: manipulation;
    }

    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(180deg, rgba(11,13,16,.1), rgba(0,0,0,.58)),
        #111;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--image);
      background-size: cover;
      background-position: center;
      opacity: var(--image-opacity, .88);
      transform: scale(1.03);
      transition: opacity .45s ease, filter .45s ease;
      filter: var(--image-filter, saturate(.82) contrast(1.05) brightness(.82));
      z-index: -2;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 58%, transparent 0 28%, rgba(0,0,0,.54) 76%),
        linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.72));
      z-index: -1;
    }

    .stage.cold::after {
      background:
        radial-gradient(circle at 50% 60%, transparent 0 22%, rgba(0,0,0,.62) 76%),
        linear-gradient(180deg, rgba(12,26,43,.22), rgba(0,0,0,.76));
    }

    .stage.warm::after {
      background:
        radial-gradient(circle at 50% 60%, rgba(214,166,84,.08), transparent 34%, rgba(0,0,0,.55) 78%),
        linear-gradient(180deg, rgba(20,14,7,.14), rgba(0,0,0,.68));
    }

    .hud {
      position: absolute;
      inset: 16px 16px auto;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .progress {
      height: 3px;
      flex: 1;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.16);
    }

    .progress span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cold), var(--warm));
      transition: width .28s ease;
    }

    .sound-toggle {
      width: 42px;
      height: 28px;
      border-radius: 99px;
      background: rgba(0,0,0,.28);
      color: var(--muted);
      font-size: 12px;
      pointer-events: auto;
    }

    .content {
      position: absolute;
      inset: 0;
      display: grid;
      align-content: end;
      gap: 18px;
      padding: 70px 26px 38px;
      z-index: 2;
    }

    .content > :not(.micro-scene) {
      position: relative;
      z-index: 1;
    }

    .kicker {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0;
    }

    .title {
      font-size: 30px;
      line-height: 1.16;
      font-weight: 700;
      text-wrap: balance;
    }

    .text {
      white-space: pre-line;
      font-size: 24px;
      line-height: 1.45;
      font-weight: 650;
      text-shadow: 0 2px 18px rgba(0,0,0,.72);
      text-wrap: balance;
    }

    .text.small {
      font-size: 19px;
      line-height: 1.62;
      font-weight: 560;
    }

    .text.center {
      align-self: center;
      text-align: center;
      font-size: 30px;
      line-height: 1.35;
    }

    .narration-subtitle {
      width: 100%;
      max-height: 34vh;
      overflow: hidden;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(0,0,0,.44), rgba(0,0,0,.62));
      text-shadow: 0 2px 14px rgba(0,0,0,.78);
    }

    .caption {
      display: inline-block;
      width: fit-content;
      max-width: 100%;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 6px;
      background: rgba(0,0,0,.38);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .review-excerpt {
      width: min(100%, 330px);
      padding: 12px 14px 13px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 6px;
      background: rgba(232,237,240,.9);
      color: #131a20;
      box-shadow: 0 18px 44px rgba(0,0,0,.42);
      font-family: "SimSun", "Microsoft YaHei", serif;
      transform: rotate(-.25deg);
    }

    .review-site {
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(27,51,70,.22);
      color: #31506b;
      font-size: 11px;
      line-height: 1.2;
    }

    .review-title {
      margin-top: 8px;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 700;
      color: #0f1720;
    }

    .review-body {
      margin-top: 8px;
      white-space: pre-line;
      font-size: 12px;
      line-height: 1.56;
      color: #2c3740;
    }

    .review-cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      margin-left: 3px;
      background: #26333d;
      vertical-align: -2px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .qq-panel {
      width: min(100%, 330px);
      padding: 11px 12px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px;
      background: rgba(232,237,242,.92);
      color: #111b24;
      box-shadow: 0 18px 44px rgba(0,0,0,.44);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .qq-title {
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(20,44,64,.2);
      color: #1d4d76;
      font-size: 13px;
      font-weight: 700;
    }

    .qq-msg {
      margin-top: 8px;
      padding: 7px 8px;
      border-radius: 5px;
      background: rgba(255,255,255,.72);
      font-size: 12px;
      line-height: 1.42;
      color: #26333d;
    }

    .novel-panel {
      width: min(100%, 330px);
      padding: 11px 12px 12px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px;
      background: rgba(236,232,218,.9);
      color: #151914;
      box-shadow: 0 18px 44px rgba(0,0,0,.44);
      font-family: "SimSun", "Microsoft YaHei", serif;
    }

    .novel-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(38,45,33,.2);
      color: #39452f;
      font-size: 12px;
      line-height: 1.2;
    }

    .novel-list {
      margin-top: 8px;
      display: grid;
      gap: 6px;
      font-size: 12px;
      line-height: 1.4;
      color: #26301f;
    }

    .novel-next {
      margin-top: 9px;
      width: fit-content;
      padding: 5px 9px;
      border: 1px solid rgba(57,69,47,.24);
      border-radius: 5px;
      background: rgba(255,255,255,.56);
      color: #2c3825;
      font-size: 12px;
    }

    .content.screen-card {
      display: block;
      padding: 0;
    }

    .screen-page {
      position: absolute;
      left: var(--screen-left);
      top: var(--screen-top);
      width: var(--screen-width);
      height: var(--screen-height);
      z-index: 1;
      overflow: hidden;
      border-radius: 3px;
      opacity: .88;
      filter: saturate(.82) contrast(.94) blur(.08px);
      transform: rotate(var(--screen-rotate, 0deg));
      transform-origin: center;
      box-shadow:
        inset 0 0 0 1px rgba(35,73,117,.24),
        inset 0 0 36px rgba(45,103,172,.18);
    }

    .content.screen-card > .screen-page {
      position: absolute;
    }

    .screen-page::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(180deg, rgba(255,255,255,.08) 0 1px, transparent 1px 4px),
        linear-gradient(90deg, rgba(0,58,140,.12), transparent 22%, rgba(0,47,110,.16));
      mix-blend-mode: multiply;
    }

    .screen-page.novel {
      background: rgba(236,232,218,.72);
    }

    .screen-page.review {
      background: rgba(232,239,247,.64);
    }

    .screen-page .review-excerpt,
    .screen-page .novel-panel {
      width: auto;
      height: 100%;
      max-width: none;
      padding: 9px 11px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      transform: none;
    }

    .screen-page .review-site,
    .screen-page .novel-head {
      font-size: 9px;
      line-height: 1.2;
      opacity: .72;
    }

    .screen-page .review-title {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.25;
    }

    .screen-page .review-body {
      margin-top: 6px;
      font-size: 9px;
      line-height: 1.5;
      color: rgba(26,35,43,.82);
    }

    .screen-page .novel-list {
      gap: 4px;
      font-size: 10px;
      line-height: 1.38;
      color: rgba(38,48,31,.82);
    }

    .screen-page .novel-next {
      margin-top: 6px;
      padding: 4px 7px;
      font-size: 10px;
      background: rgba(255,255,255,.42);
    }

    .choice {
      width: 100%;
      min-height: 56px;
      padding: 13px 14px;
      border-radius: 8px;
      text-align: left;
      background: rgba(10,10,9,.72);
      backdrop-filter: blur(10px);
      line-height: 1.35;
    }

    .choice:active { transform: translateY(1px); }

    .cover {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      align-content: end;
      gap: 18px;
      padding: 40px 28px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.7)),
      url("assets/img/cover-v17-clean-desk-standard-20260706.jpg") center / cover;
    }

    .primary {
      width: 100%;
      min-height: 54px;
      border-radius: 8px;
      background: #f0d5a6;
      color: #1b130b;
      border: 0;
      font-weight: 700;
    }

    .secondary {
      width: 100%;
      min-height: 46px;
      border-radius: 8px;
      background: rgba(0,0,0,.42);
      color: #efe3cf;
      font-size: 14px;
    }

    .muted-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 0;
    }

    .cover-hook {
      margin: 0;
      color: #f3dfb8;
      font-size: 20px;
      line-height: 1.45;
      font-weight: 650;
      text-shadow: 0 2px 18px rgba(0,0,0,.72);
      text-wrap: balance;
    }

    .paused .hint { opacity: 1; }

    .hint {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 8;
      transform: translate(-50%, -50%);
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(0,0,0,.72);
      color: var(--muted);
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }

    .photo-stack {
      align-self: center;
      display: grid;
      gap: 12px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 12px;
      position: relative;
    }

    .photo-stack.has-memory {
      gap: 8px;
    }

    .photo-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    .photo-row img,
    .photo-main {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.16);
      filter: saturate(.86) contrast(1.04);
    }

    .photo-main { max-height: 360px; }

    .photo-stack.has-memory .photo-main {
      max-height: 304px;
    }

    .frog-drift {
      height: 190px;
      margin-top: 8px;
      border-radius: 12px;
      overflow: hidden;
      opacity: .86;
      filter: saturate(.98) contrast(1.08) brightness(1.08);
      position: relative;
      z-index: 1;
    }

    .photo-stack.has-memory .frog-drift {
      position: absolute;
      right: 10px;
      bottom: 74px;
      width: min(22vw, 78px);
      max-width: 78px;
      aspect-ratio: 9 / 16;
      height: auto;
      margin-top: 0;
      justify-self: center;
      opacity: .72;
      z-index: 4;
      box-shadow: 0 18px 40px rgba(0,0,0,.5);
      background:
        radial-gradient(circle at 50% 64%, rgba(217,137,45,.28), transparent 52%),
        rgba(0,0,0,.38);
    }

    .frog-drift img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: none;
      animation: frogBreath 36s ease-in-out infinite alternate;
    }

    @keyframes frogBreath {
      from { filter: brightness(.96) saturate(.94); opacity: .9; }
      to   { filter: brightness(1.08) saturate(1.04); opacity: 1; }
    }

    .memory-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      opacity: .56;
      animation: memoryPulse 18s ease-in-out infinite alternate;
    }

    .memory-strip img {
      width: 100%;
      height: 36px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.12);
      filter: saturate(.7) contrast(1.05) brightness(.78);
    }

    @keyframes memoryPulse {
      from { opacity: .38; transform: translateY(1px); }
      to   { opacity: .66; transform: translateY(-1px); }
    }

    .content.photo-card {
      display: block;
      padding: 0;
    }

    .photo-visual {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .photo-visual .frog-drift {
      position: absolute;
      left: 18px;
      bottom: calc(50% + 22px);
      width: 58px;
      height: 104px;
      margin: 0;
      opacity: .34;
      box-shadow: 0 16px 34px rgba(0,0,0,.46);
      background: rgba(0,0,0,.18);
    }

    .rolling-caption {
      position: absolute;
      left: 50%;
      right: auto;
      bottom: 28px;
      width: calc(100% - 36px);
      height: min(24%, 180px);
      transform: translateX(-50%);
      z-index: 3;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.46), rgba(0,0,0,.64)),
        rgba(0,0,0,.42);
      box-shadow: 0 18px 48px rgba(0,0,0,.38);
    }

    .rolling-caption::before,
    .rolling-caption::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      z-index: 2;
      height: 34px;
      pointer-events: none;
    }

    .rolling-caption::before {
      top: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.82), transparent);
    }

    .rolling-caption::after {
      bottom: 0;
      background: linear-gradient(0deg, rgba(0,0,0,.86), transparent);
    }

    .rolling-caption-text {
      padding: 22px 18px 26px;
      white-space: pre-line;
      color: #fff2d8;
      font-size: 18px;
      line-height: 1.68;
      font-weight: 650;
      text-shadow: 0 2px 12px rgba(0,0,0,.72);
      will-change: transform;
    }

    .rolling-caption-text.is-scrolling {
      animation: captionScroll var(--scroll-duration, 109500ms) linear forwards;
    }

    @keyframes captionScroll {
      to { transform: translateY(calc(-1 * var(--scroll-distance, 0px))); }
    }

    .night-tail {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .night-tail::before {
      content: "";
      position: absolute;
      left: 28%;
      top: 43%;
      width: 45%;
      height: 15%;
      border-radius: 4px;
      border: 1px solid rgba(91,139,178,.22);
      background:
        linear-gradient(180deg, rgba(78,133,184,.52), rgba(16,27,38,.76)),
        repeating-linear-gradient(0deg, transparent 0 12px, rgba(255,255,255,.05) 12px 13px);
      box-shadow: 0 0 46px rgba(53,111,169,.3);
      animation: screenSleep 6.8s ease-in forwards;
    }

    .night-tail::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      animation: nightBlack 6.8s ease-in forwards;
    }

    @keyframes screenSleep {
      0%, 42% { opacity: .72; filter: brightness(1); }
      62% { opacity: .36; filter: brightness(.58); }
      78% { opacity: .08; filter: brightness(.22); }
      100% { opacity: 0; filter: brightness(0); }
    }

    @keyframes nightBlack {
      0%, 76% { opacity: 0; }
      90% { opacity: .38; }
      100% { opacity: .84; }
    }

    .content > .day-start {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .day-start::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #000;
      animation: dayStartBlack 5.2s ease-out forwards;
    }

    .day-start::after {
      content: "";
      position: absolute;
      left: 29%;
      top: 39%;
      width: 43%;
      height: 21%;
      border-radius: 5px;
      background: radial-gradient(circle at 50% 50%, rgba(90,180,255,.78), rgba(33,91,164,.22) 64%, transparent 72%);
      filter: blur(2px);
      opacity: 0;
      animation: blueWake 5.2s ease-out forwards;
    }

    @keyframes dayStartBlack {
      0%, 18% { opacity: .96; }
      32% { opacity: .42; }
      100% { opacity: 0; }
    }

    @keyframes blueWake {
      0%, 18% { opacity: 0; transform: scale(.92); }
      24% { opacity: .88; transform: scale(1.04); }
      46% { opacity: .46; transform: scale(1); }
      100% { opacity: .16; transform: scale(1.02); }
    }

    .micro-scene {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 24%, rgba(32,61,88,.32), transparent 34%),
        linear-gradient(180deg, #101112 0%, #070707 70%);
    }

    .micro-scene::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 14%;
      width: 68%;
      height: 26%;
      transform: translateX(-50%);
      border: 1px solid rgba(121,162,196,.2);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(80,135,188,.58), rgba(20,31,43,.78)),
        repeating-linear-gradient(0deg, transparent 0 18px, rgba(255,255,255,.06) 18px 19px);
      box-shadow: 0 0 52px rgba(74,126,180,.28);
      opacity: .62;
    }

    .desk {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56%;
      background:
        radial-gradient(ellipse at 56% 18%, rgba(255,255,255,.07), transparent 22%),
        linear-gradient(150deg, #32281e, #15110d 72%);
      transform: perspective(520px) rotateX(5deg);
      transform-origin: bottom;
      box-shadow: inset 0 26px 60px rgba(0,0,0,.46);
    }

    .mess {
      position: absolute;
      border-radius: 6px;
      background: rgba(185,169,132,.16);
      box-shadow: 0 8px 22px rgba(0,0,0,.38);
    }

    .mess.m1 { width: 86px; height: 54px; left: 12%; bottom: 24%; transform: rotate(-8deg); }
    .mess.m2 { width: 62px; height: 84px; right: 16%; bottom: 26%; transform: rotate(11deg); }
    .mess.m3 { width: 96px; height: 18px; left: 30%; bottom: 17%; transform: rotate(4deg); }
    .ash {
      position: absolute;
      left: 20%;
      bottom: 36%;
      width: 72px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle, #5a5146, #171310 72%);
      box-shadow: inset 0 0 16px rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.46);
    }

    .cup {
      position: absolute;
      right: 17%;
      bottom: 32%;
      width: 58px;
      height: 78px;
      border-radius: 9px 9px 18px 18px;
      background:
        radial-gradient(ellipse at 48% 16%, rgba(110,75,42,.58), rgba(221,208,169,.86) 56%),
        linear-gradient(90deg, #c8b88b, #eee5ca 48%, #a89667);
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 18px 38px rgba(0,0,0,.62);
    }

    .cup::after {
      content: "";
      position: absolute;
      inset: 10px 10px auto auto;
      width: 16px;
      height: 42px;
      border-radius: 12px;
      border: 5px solid rgba(59,45,31,.76);
      border-left: 0;
      transform: translateX(18px);
    }

    .hand {
      position: absolute;
      left: 21%;
      bottom: 23%;
      width: 34%;
      height: 58px;
      border-radius: 40px 26px 22px 40px;
      background: linear-gradient(90deg, #5b3b29, #a97958 76%, #c69471);
      box-shadow: 0 12px 36px rgba(0,0,0,.55);
      transform-origin: left center;
    }

    .hand::after {
      content: "";
      position: absolute;
      right: -20px;
      top: 10px;
      width: 48px;
      height: 14px;
      border-radius: 99px;
      background: #c69471;
      box-shadow:
        0 12px 0 #b98766,
        0 24px 0 #a87658;
    }

    .distance-mark {
      position: absolute;
      left: 54%;
      right: 32%;
      bottom: 38%;
      border-top: 1px dashed rgba(244,224,190,.44);
      opacity: 0;
    }

    .micro-screen .desk { filter: blur(.6px) brightness(.68); }
    .micro-desk::before { opacity: .48; }
    .micro-reach .hand { transform: translateX(22%) rotate(-3deg); }
    .micro-reach .distance-mark { opacity: 1; }
    .micro-freeze .hand { transform: translateX(24%) rotate(-3deg); animation: tremble 1.8s infinite; }
    .micro-freeze .distance-mark { opacity: 1; }
    .micro-still .hand { transform: translateX(-5%) rotate(1deg); opacity: .84; }
    .micro-abyss {
      background: radial-gradient(circle at 50% 30%, rgba(49,76,98,.16), transparent 22%), #010101;
    }
    .micro-abyss::before,
    .micro-abyss .desk,
    .micro-abyss .mess,
    .micro-abyss .ash,
    .micro-abyss .cup,
    .micro-abyss .hand,
    .micro-abyss .distance-mark { opacity: 0; }

    @keyframes tremble {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(.88); }
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* 停顿〇触发器：沿用按钮类名，语义是身体声音，不是剧情分支。 */
    .visual-choice {
      min-height: 176px;
      padding: 0;
      overflow: hidden;
      border-radius: 8px;
      background: rgba(0,0,0,.72);
      text-align: left;
    }

    .visual-choice:disabled {
      opacity: .64;
      cursor: default;
    }

    .choice-scene {
      position: relative;
      height: 110px;
      overflow: hidden;
      background: #090909;
    }

    .choice-scene img,
    .pause-animation img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .choice-scene .micro-scene {
      transform: scale(.72);
      transform-origin: center;
      inset: -50px -62px;
    }

    .choice-copy {
      display: grid;
      gap: 3px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.28;
    }

    .choice-copy strong { font-size: 16px; }

    .pause-animation {

            "imgOpacity": 0.9,
            "imgFilter": "saturate(.92) contrast(1.02) brightness(.78)",
            "bed": "silence",
            "sound": "silence",
            "text": "你有没有过这样的时刻？\n\n有一件事，\n一直觉得挺正常。\n\n甚至，挺充实。\n\n直到有一个很小的东西，\n忽然照了一下。\n\n才发现——\n\n可能已经很久，\n没有真正出去了。",
            "fixed": 17000,
            "scrollText": true
      }
];

    const stage      = document.getElementById("stage");
    const content    = document.getElementById("content");
    const cover      = document.getElementById("cover");
    const startBtn   = document.getElementById("startBtn");
    const progressBar= document.getElementById("progressBar");
    const phone      = document.getElementById("phone");
    const voiceToggle= document.getElementById("voiceToggle");

    let index       = 0;
    let timer       = null;
    let activeAudio = null;
    let running     = false;
    let paused      = false;
    let pressTimer  = null;
    let finalStopTimer = null;
    let touchMoved  = false;
    let audioContext= null;
    let soundNodes  = [];

    // ─── Bed / BGM state ────────────────────────────────────────
    let bedAudio       = null;
    let bgmAudio       = null;
    let currentBedType = null;   // tracks running bed type to avoid restarts
    let bgmRunning     = false;
    let currentBgmType = null;

    // ─── Helpers ────────────────────────────────────────────────
    function escapeHtml(v) {
      return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    const loadedImageUrls = new Set();
    const imagePreloadJobs = new Map();

    function imageCssValue(src) {
      return `url("${src}")`;
    }

    function preloadImage(src) {
      if (!src) return Promise.resolve("");
      if (loadedImageUrls.has(src)) return Promise.resolve(src);
      if (imagePreloadJobs.has(src)) return imagePreloadJobs.get(src);

      const img = new Image();
      img.decoding = "async";
      const job = new Promise(resolve => {
        img.onload = () => {
          loadedImageUrls.add(src);
          resolve(src);
        };
        img.onerror = () => {
          console.warn("Image failed to load:", src);
          resolve("");
        };
      });
      imagePreloadJobs.set(src, job);
      img.src = src;
      return job;
    }

    function setImage(card) {
      stage.classList.toggle("has-visual", !!(card && card.visual));
      const src = card && card.img ? card.img : "";
      if (src) {
        stage.dataset.pendingImage = src;
        if (loadedImageUrls.has(src)) {
          stage.style.setProperty("--image", imageCssValue(src));
        } else {
          preloadImage(src).then(loadedSrc => {
            if (loadedSrc && stage.dataset.pendingImage === loadedSrc) {
              stage.style.setProperty("--image", imageCssValue(loadedSrc));
            }
          });
          if (!stage.style.getPropertyValue("--image")) {
            stage.style.setProperty("--image", imageCssValue(src));
          }
        }
      } else if (!stage.style.getPropertyValue("--image")) {
        stage.style.setProperty("--image", "none");
      }
      stage.style.setProperty("--image-opacity", card && card.imgOpacity !== undefined ? card.imgOpacity : ".88");
      stage.style.setProperty("--image-filter", card && card.imgFilter ? card.imgFilter : "saturate(.82) contrast(1.05) brightness(.82)");
      stage.classList.toggle("cold", card && card.mood === "cold");
      stage.classList.toggle("warm", card && card.mood === "warm");
    }

    // ─── Oscillator soundscape (unchanged, for drop / thin) ─────
    function stopSoundscape() {
      soundNodes.forEach(n => { try { if(n.stop) n.stop(); if(n.disconnect) n.disconnect(); } catch(e){} });
      soundNodes = [];
    }

    function startSoundscape(type) {
      stopSoundscape();
      // fan / street are handled by file-based bed; silence = nothing
      if (!type || type === "silence" || type === "fan" || type === "street") return;
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") audioContext.resume().catch(()=>{});
      const gain = audioContext.createGain();
      gain.gain.value = type === "drop" ? 0.03 : type === "thin" ? 0.018 : 0.026;
      gain.connect(audioContext.destination);
      const osc = audioContext.createOscillator();
      osc.type = "sine";
      osc.frequency.value = type === "drop" ? 48 : type === "thin" ? 82 : 66;
      osc.connect(gain); osc.start();
      soundNodes.push(osc, gain);
      if (type === "drop") {
        const lfoGain = audioContext.createGain();
        const lfo = audioContext.createOscillator();
        lfo.frequency.value = 0.55; lfoGain.gain.value = 11;
        lfo.connect(lfoGain); lfoGain.connect(osc.frequency); lfo.start();
        soundNodes.push(lfo, lfoGain);
      }
    }

    // ─── File-based bed ─────────────────────────────────────────
    function startBed(type) {
      if (type === currentBedType) return;   // already playing this bed
      currentBedType = type;

      if (bedAudio) { bedAudio.pause(); bedAudio = null; }

      const src = BED_FILES[type];
      if (!src) return;

      const a = new Audio(src);
      a.loop   = true;
      a.volume = BED_VOLUMES[type] ?? 0.18;
      bedAudio = a;
      a.play().catch(() => {
        // fallback: oscillator hum
        startSoundscape(type);
      });
    }

    function stopBed() {
      currentBedType = null;
      if (bedAudio) { bedAudio.pause(); bedAudio = null; }
    }

    // ─── BGM ────────────────────────────────────────────────────
    function startBgm(type = "warmLow") {
      if (bgmAudio && bgmRunning && currentBgmType === type) return;
      stopBgm();
      const src = BGM_FILES[type];
      if (!src) return;
      const a = new Audio(src);
      a.loop = true;
      a.volume = BGM_VOLUMES[type] ?? 0.035;
      bgmAudio = a;
      bgmRunning = true;
      currentBgmType = type;
      a.play().catch(() => { bgmRunning = false; });
    }

    function stopBgm() {
      bgmRunning = false;
      currentBgmType = null;
      if (bgmAudio) { bgmAudio.pause(); bgmAudio = null; }
    }

    // ─── SFX one-shot ───────────────────────────────────────────
    function playSfx(keys) {
      if (!keys || !keys.length) return;
      keys.forEach(key => {
        const src = SFX[key];
        if (!src) return;
        const a = new Audio(src);
        a.volume = 0.68;
        a.play().catch(() => {});
      });
    }

    // ─── Audio lifecycle ────────────────────────────────────────
    function stopAudio() {
      if (activeAudio) { activeAudio.pause(); activeAudio = null; }
      stopSoundscape();
      // NOTE: bed and bgm are NOT stopped here; they persist across cards
    }

    function stopAllAudio() {
      stopAudio();
      stopBed();
      stopBgm();
    }

    function clearFinalStopTimer() {
      if (finalStopTimer) {
        clearTimeout(finalStopTimer);
        finalStopTimer = null;
      }
    }

    function scheduleFinalStop(card) {
      clearFinalStopTimer();
      if (!running || paused || index !== cards.length - 1) return;
      finalStopTimer = window.setTimeout(() => {
        finalStopTimer = null;
        stopAllAudio();
      }, durationFor(card) + 5000);
    }

    function durationFor(card) {
      if (card.fixed) return card.fixed;
      const chars = (card.text||"").replace(/\s/g,"").length;
      return Math.max(3800, Math.min(12000, 2200 + chars * 180));
    }

    function progressValue() {
      const playable = cards.filter(c => !c.pause).length;
      const played   = cards.slice(0, index + 1).filter(c => !c.pause).length;
      return Math.min(100, Math.max(0, (played / playable) * 100));
    }

    function updateProgress() {
      progressBar.style.width = `${progressValue()}%`;
    }

    function playAudio(card, done) {
      if (activeAudio) { activeAudio.pause(); activeAudio = null; }
      const src = card.audioFull || (card.audio ? `${voiceSets[voiceSet]}${card.audio}` : "");
      if (!src) return false;
      const audio = new Audio(src);
      activeAudio = audio;
      let settled = false;
      const fallback = () => { if (settled || audio !== activeAudio) return; settled=true; done(false); };
      audio.addEventListener("ended", () => { if (settled || audio !== activeAudio) return; settled=true; done(true); });
      audio.addEventListener("error", fallback, { once: true });
      audio.play().catch(fallback);
      return true;
    }

    function schedule(card) {
      clearTimeout(timer);
      if (!running || paused || card.pause || index >= cards.length - 1) return;
      timer = window.setTimeout(next, durationFor(card));
    }

    function visualMarkup(name) {
      if (name === "black") return "";
      const cls = { screen:"micro-screen", desk:"micro-desk", cup:"micro-cup",
        reach:"micro-reach", freeze:"micro-freeze", still:"micro-still", abyss:"micro-abyss" }[name] || "micro-desk";
      return `<div class="micro-scene ${cls}" aria-hidden="true">
        <div class="desk"></div><div class="mess m1"></div><div class="mess m2"></div>
        <div class="mess m3"></div><div class="ash"></div><div class="cup"></div>
        <div class="hand"></div><div class="distance-mark"></div></div>`;
    }

    const PAUSE_IMAGES = {
      reach: "assets/img/pause-0-reach-v17-eye-pov-20260706.jpg",
      still: "assets/img/pause-0-still-v17-eye-pov-20260706.jpg",
      freeze: "assets/img/pause-0-still-v17-eye-pov-20260706.jpg",
    };

    function warmAllImages() {
      const refs = new Set();
      cards.forEach(card => {
        if (card.img) refs.add(card.img);
        if (card.frog) refs.add(card.frog);
        (card.memoryImgs || []).forEach(src => refs.add(src));
      });
      Object.values(PAUSE_IMAGES).forEach(src => refs.add(src));

      refs.forEach(src => {
        const link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.href = src;
        document.head.appendChild(link);
        preloadImage(src);
      });
    }

    warmAllImages();

    function pauseImageMarkup(name) {
      const src = PAUSE_IMAGES[name] || PAUSE_IMAGES.still;
      return `<img src="${escapeHtml(src)}" alt="">`;
    }

    function reviewMarkup(card) {
      if (!card.review) return "";
      return `<div class="review-excerpt">
        <div class="review-site">${escapeHtml(card.review.site)}</div>
        <div class="review-title">${escapeHtml(card.review.title)}</div>
        <div class="review-body">${escapeHtml(card.review.body)}${card.review.cursor ? `<span class="review-cursor"></span>` : ""}</div>
      </div>`;
    }

    function qqMarkup(card) {
      if (!card.qq) return "";
      return `<div class="qq-panel">
        <div class="qq-title">${escapeHtml(card.qq.title)}</div>
        ${(card.qq.messages || []).map(msg => `<div class="qq-msg">${escapeHtml(msg)}</div>`).join("")}
      </div>`;
    }

    function novelMarkup(card) {
      if (!card.novel) return "";
      const head = card.novel.head || [];
      return `<div class="novel-panel">
        <div class="novel-head"><span>${escapeHtml(head[0] || "玄幻小说")}</span><span>${escapeHtml(head[1] || "")}</span></div>
        <div class="novel-list">${(card.novel.rows || []).map(row => `<div>${escapeHtml(row)}</div>`).join("")}</div>
        ${card.novel.next ? `<div class="novel-next">${escapeHtml(card.novel.next)}</div>` : ""}
      </div>`;
    }

    const SCREEN_PAGES = {
      "card-03": { type: "novel",  left: "15.0%", top: "35.6%", width: "61.0%", height: "20.8%", rotate: "-.15deg" },
      "card-05": { type: "review", left: "9.2%",  top: "27.4%", width: "81.6%", height: "31.4%", rotate: ".35deg" },
      "card-07": { type: "review", left: "12.4%", top: "24.2%", width: "75.8%", height: "27.8%", rotate: ".1deg" },
    };
    const TEXTLESS_VISUAL_CARDS = new Set(["card-03", "card-05", "card-06", "card-07"]);

    function hideVisualText(card) {
      return card && TEXTLESS_VISUAL_CARDS.has(card.id);
    }

    function screenPage(card) {
      return card ? SCREEN_PAGES[card.id] : null;
    }

    function screenPageStyle(page) {
      return [
        `--screen-left:${page.left}`,
        `--screen-top:${page.top}`,
        `--screen-width:${page.width}`,
        `--screen-height:${page.height}`,
        `--screen-rotate:${page.rotate || "0deg"}`,
      ].join(";");
    }

    function pageMarkup(card) {
      if (hideVisualText(card)) return "";
      const page = screenPage(card);
      if (page && (card.review || card.novel)) {
        return `<div class="screen-page ${page.type}" style="${screenPageStyle(page)}">
          ${reviewMarkup(card)}
          ${novelMarkup(card)}
        </div>`;
      }
      return `${reviewMarkup(card)}${qqMarkup(card)}${novelMarkup(card)}`;
    }

    function captionMarkup(card) {
      return card.caption && !screenPage(card) && !hideVisualText(card)
        ? `<div class="caption">${escapeHtml(card.caption)}</div>`
        : "";
    }

    function textMarkup(card, cls) {
      if (!card.text) return "";
      if (card.audio && card.kind !== "center") {
        return `<div class="${cls} narration-subtitle">${escapeHtml(card.text)}</div>`;
      }
      if (hideVisualText(card)) return "";
      if ((card.review || card.novel) && screenPage(card)) return "";
      return `<div class="${cls}">${escapeHtml(card.text)}</div>`;
    }

    function renderVisual(card) {
      content.innerHTML = `
        ${visualMarkup(card.visual)}
        ${captionMarkup(card)}
        ${pageMarkup(card)}
        ${textMarkup(card, `text ${card.kind==="center"?"center":"small"}`)}`;
    }

    function renderNightTail() {
      content.innerHTML = `<div class="night-tail" aria-hidden="true"></div>`;
    }

    function renderDayStart(card) {
      content.innerHTML = `
        <div class="day-start" aria-hidden="true"></div>
        <div class="text small narration-subtitle">${escapeHtml(card.text)}</div>`;
    }

    function memoryMarkup(card) {
      if (!card.memoryImgs || !card.memoryImgs.length) return "";
      return `<div class="memory-strip" aria-hidden="true">${
        card.memoryImgs.map(src => `<img src="${escapeHtml(src)}" alt="">`).join("")
      }</div>`;
    }

    function renderPhoto(card) {
      content.innerHTML = `
        <div class="photo-visual" aria-hidden="true">
          ${card.frog ? `<div class="frog-drift" aria-hidden="true"><img src="${escapeHtml(card.frog)}" alt=""></div>` : ""}
          ${memoryMarkup(card)}
        </div>
        <div class="rolling-caption" aria-label="正文字幕">
          <div class="rolling-caption-text">${escapeHtml(card.text)}</div>
        </div>`;
      setupRollingCaption(card);
    }

    function renderScrollingText(card) {
      content.innerHTML = `
        <div class="rolling-caption" aria-label="正文字幕">
          <div class="rolling-caption-text">${escapeHtml(card.text)}</div>
        </div>`;
      setupRollingCaption(card);
    }

    function setupRollingCaption(card) {
      const windowEl = content.querySelector(".rolling-caption");
      const textEl = content.querySelector(".rolling-caption-text");
      if (!windowEl || !textEl) return;
      window.requestAnimationFrame(() => {
        const distance = Math.max(0, textEl.scrollHeight - windowEl.clientHeight);
        textEl.style.setProperty("--scroll-distance", `${distance}px`);
        textEl.style.setProperty("--scroll-duration", `${card.fixed || durationFor(card)}ms`);
        textEl.classList.toggle("is-scrolling", distance > 0);
      });
    }

    function render(card) {
      clearTimeout(timer);
      clearFinalStopTimer();
      stopAudio();   // stops narration + oscillators; bed & bgm persist
      updateProgress();
      setImage(card);
      const contentClasses = ["content"];
      if (screenPage(card) && !hideVisualText(card)) contentClasses.push("screen-card");
      if (card.kind === "photo" || card.scrollText) contentClasses.push("photo-card");
      content.className = contentClasses.join(" ");
      content.dataset.cardId = card.id || "";

      // ── 声音路由 ──────────────────────────────────────────────
      const bedType = card.bed;
      if (bedType === "fan" || bedType === "street") {
        startBed(bedType);
      } else if (bedType === "silence") {
        stopBed();
      } else if (bedType === undefined) {
        // no change to bed
      } else {
        stopBed();
      }

      const soundType = card.sound;
      if (soundType === "silence" || soundType === undefined) {
        stopSoundscape();
      } else {
        startSoundscape(soundType);    // oscillator for drop / thin
      }

      if (card.bgm === "warm-low") {
        startBgm("warmLow");
      } else {
        stopBgm();
      }

      // ── sfx 一次性音效 ────────────────────────────────────────
      playSfx(card.sfx);

      if (card.pause) {
        content.innerHTML = `
          ${visualMarkup(card.visual)}
          <div class="choice-grid" aria-label="两个身体声音触发器">
            <button class="visual-choice" id="btn-reach">
              <div class="choice-scene">${pauseImageMarkup("reach")}</div>
              <div class="choice-copy"><strong>把身子送出去</strong></div>
            </button>
            <button class="visual-choice" id="btn-still">
              <div class="choice-scene">${pauseImageMarkup("still")}</div>
              <div class="choice-copy"><strong>真的不想动</strong></div>
            </button>
          </div>`;
        content.querySelectorAll(".visual-choice").forEach(btn => {
          btn.addEventListener("click", () => handlePauseTrigger(card));
        });
        return;
      }

      if (card.kind === "photo") {
        renderPhoto(card);
      } else if (card.scrollText) {
        renderScrollingText(card);
      } else if (card.kind === "night-tail") {
        renderNightTail(card);
      } else if (card.kind === "day-start") {
        renderDayStart(card);
      } else if (card.visual) {
        renderVisual(card);
      } else {
        const cls = `text ${card.kind==="center"?"center":"small"}`;
        content.innerHTML = `
          ${captionMarkup(card)}
          ${pageMarkup(card)}
          ${textMarkup(card, cls)}`;
      }

      const hasAudio = playAudio(card, ok => {
        if (ok) { timer = window.setTimeout(next, 900); }
        else     { schedule(card); }
        scheduleFinalStop(card);
      });
      if (!hasAudio) schedule(card);
      scheduleFinalStop(card);
    }

    function next() {
      if (!running) return;
      if (index >= cards.length - 1) return;
      index = Math.min(index + 1, cards.length - 1);
      render(cards[index]);
    }

    function handlePauseTrigger(card) {
      content.querySelectorAll(".visual-choice").forEach(btn => {
        btn.disabled = true;
      });

      const sequence = ["reach", "still", "reach", "still", "freeze"];
      let frame = 0;
      const renderFrame = () => {
        const view = sequence[frame];
        content.innerHTML = `
          <div class="pause-animation">${pauseImageMarkup(view)}</div>`;
        if (frame < sequence.length - 1) {
          frame += 1;
          timer = window.setTimeout(renderFrame, 600);
        } else {
          timer = window.setTimeout(() => jumpTo("card-11"), 500);
        }
      };
      renderFrame();
    }

    function jumpTo(id) {
      clearFinalStopTimer();
      const nextIndex = cards.findIndex(c => c.id === id);
      index   = nextIndex >= 0 ? nextIndex : 0;
      running = true;
      paused  = false;
      cover.style.display = "none";
      render(cards[index]);
    }

    function start() {
      clearFinalStopTimer();
      running = true;
      paused  = false;
      cover.style.display = "none";
      index   = 0;
      render(cards[index]);
    }

    function pause() {
      if (!running || paused) return;
      paused = true;
      clearTimeout(timer);
      clearFinalStopTimer();
      if (activeAudio) activeAudio.pause();
      if (bedAudio)    bedAudio.pause();
      if (bgmAudio)    bgmAudio.pause();
      phone.classList.add("paused");
    }

    function resume() {
      if (!running || !paused) return;
      paused = false;
      phone.classList.remove("paused");
      if (activeAudio) activeAudio.play().catch(()=>{});
      if (bedAudio)    bedAudio.play().catch(()=>{});
      if (bgmAudio)    bgmAudio.play().catch(()=>{});
      if (!activeAudio) schedule(cards[index]);
      if (!activeAudio) scheduleFinalStop(cards[index]);
    }

    startBtn.addEventListener("click", start);

    voiceToggle.addEventListener("click", e => {
      e.stopPropagation();
      voiceSet = voiceSet === "A" ? "B" : "A";
      voiceToggle.textContent = voiceSet;
    });

    phone.addEventListener("pointerdown", () => { touchMoved=false; pressTimer=window.setTimeout(pause,520); });
    phone.addEventListener("pointermove", () => { touchMoved=true; clearTimeout(pressTimer); });
    phone.addEventListener("pointerup",   () => {
      clearTimeout(pressTimer);
      if (!running || touchMoved) return;
      if (paused) { resume(); return; }
      const card = cards[index];
      if (!card.pause) next();
    });
    phone.addEventListener("pointerleave", () => clearTimeout(pressTimer));
  </script>
</body>
</html>
