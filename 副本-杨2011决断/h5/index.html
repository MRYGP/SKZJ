<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>人生馆001号 · 2011，那只水杯</title>
  <style>
    :root {
      --bg: #080807;
      --fg: #f4efe6;
      --muted: rgba(244, 239, 230, 0.7);
      --line: rgba(244, 239, 230, 0.18);
      --accent: #d7b46a;     /* 暖金：觉醒/砍刀/逆转 */
      --cold: #6f8aa8;       /* 冷蓝：低谷里唯一的光＝显示器（克制使用） */
      --danger: #9b2f24;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 20%, rgba(120, 93, 52, 0.18), transparent 38%),
        linear-gradient(180deg, #0d0d0b 0%, #050504 100%);
    }

    .phone {
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      overflow: hidden;
      background: var(--bg);
      isolation: isolate;
    }

    .stage {
      position: absolute;
      inset: 0;
      padding: calc(34px + var(--safe-top)) 26px calc(42px + var(--safe-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: left;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.035), transparent 22%),
        radial-gradient(circle at 50% 72%, rgba(215, 180, 106, 0.08), transparent 42%),
        #080807;
      opacity: 1;
      transition: opacity 0.6s ease, background 1.2s ease;
    }

    /* 低谷：屋里唯一的光来自显示器，蓝的 —— 冷蓝替换暖金辉光，克制 */
    .stage.cold {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent 22%),
        radial-gradient(circle at 50% 60%, rgba(111, 138, 168, 0.12), transparent 46%),
        #07080a;
    }

    .stage.fade { opacity: 0; }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255,255,255,0.012) 1px, transparent 1px);
      background-size: 34px 34px;
      opacity: 0.35;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
    }

    .kicker {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .text {
      font-size: clamp(26px, 6.6vw, 40px);
      line-height: 1.46;
      font-weight: 560;
      text-wrap: balance;
      white-space: pre-line;
    }

    .text.small {
      font-size: clamp(21px, 5.4vw, 30px);
      line-height: 1.55;
      font-weight: 500;
      color: rgba(244, 239, 230, 0.93);
    }

    .text.center {
      text-align: center;
      font-size: clamp(34px, 10vw, 60px);
      line-height: 1.18;
      font-weight: 700;
    }

    .text.heart {
      text-align: center;
      font-size: clamp(29px, 8.4vw, 52px);
      line-height: 1.3;
      font-weight: 760;
    }

    .text strong { color: #fff7d9; font-weight: 800; }

    /* 砍刀：一字一顿 —— 三行依次浮现 */
    .reveal-line {
      display: block;
      opacity: 0;
      transform: translateY(8px);
      animation: lineIn 0.9s ease forwards;
    }
    @keyframes lineIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .card-photo {
      display: block;
      width: min(78%, 360px);
      max-height: 42vh;
      margin: 0 auto 24px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid rgba(244, 239, 230, 0.2);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42);
    }
    /* 真容照缺省时的占位（本窗口预览用；落盘后接真实照片不显示） */
    .photo-fallback {
      display: grid;
      place-items: center;
      width: min(78%, 360px);
      height: 30vh;
      margin: 0 auto 24px;
      border: 1px solid rgba(244, 239, 230, 0.18);
      border-radius: 4px;
      color: rgba(244, 239, 230, 0.42);
      font-size: 14px;
      background: rgba(255,255,255,0.03);
    }

    .photo-copy { display: grid; gap: 14px; }

    .choices {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .choice {
      width: 100%;
      min-height: 58px;
      padding: 15px 16px;
      border: 1px solid rgba(244, 239, 230, 0.23);
      border-radius: 8px;
      background: rgba(244, 239, 230, 0.08);
      text-align: left;
      font-size: clamp(18px, 4.7vw, 24px);
      line-height: 1.35;
      backdrop-filter: blur(8px);
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .choice:active {
      background: rgba(215, 180, 106, 0.18);
      border-color: rgba(215, 180, 106, 0.52);
    }
    .choice:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .progress {
      position: absolute;
      left: 0; bottom: 0;
      width: 100%; height: 2px;
      z-index: 5;
      background: rgba(244, 239, 230, 0.1);
    }
    .progress > span {
      display: block;
      width: 0; height: 100%;
      background: var(--accent);
      transition: width 0.3s linear;
    }

    .hint {
      position: absolute;
      left: 20px; right: 20px;
      bottom: calc(18px + var(--safe-bottom));
      z-index: 3;
      color: rgba(244, 239, 230, 0.48);
      font-size: 12px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .paused .hint { opacity: 1; }

    .cover, .modal, .landscape {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 26px;
      background:
        radial-gradient(circle at 50% 35%, rgba(215, 180, 106, 0.16), transparent 34%),
        linear-gradient(180deg, #11100d, #050504);
    }

    .cover-inner, .modal-inner { width: 100%; text-align: center; }

    .title {
      margin: 0 0 12px;
      font-size: clamp(34px, 9.8vw, 58px);
      line-height: 1.08;
      font-weight: 800;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: clamp(16px, 4.2vw, 22px);
      line-height: 1.55;
    }

    .primary {
      min-width: 148px;
      min-height: 54px;
      padding: 13px 22px;
      border-radius: 8px;
      background: var(--fg);
      color: #11100d;
      font-size: 20px;
      font-weight: 700;
    }

    .muted-note {
      margin-top: 18px;
      color: rgba(244, 239, 230, 0.4);
      font-size: 12px;
      line-height: 1.5;
    }

    .secondary {
      margin-top: 14px;
      min-height: 46px;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid rgba(244, 239, 230, 0.28);
      background: transparent;
      color: var(--fg);
      font-size: 16px;
    }

    .contact-card {
      margin: 22px auto 18px;
      width: min(62vw, 260px);
      aspect-ratio: 1;
      border: 1px dashed rgba(244, 239, 230, 0.38);
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: rgba(244, 239, 230, 0.6);
      background: rgba(255,255,255,0.04);
      font-size: 18px;
    }

    .modal { display: none; z-index: 20; background: rgba(5,5,4,0.92); }
    .modal.show { display: flex; }

    .landscape {
      display: none;
      z-index: 30;
      text-align: center;
      font-size: 22px;
      line-height: 1.5;
    }
    @media (orientation: landscape) and (max-height: 640px) {
      .landscape { display: flex; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage { transition: opacity 0.2s ease; }
      .reveal-line { animation-duration: 0.01s; }
    }
  </style>
</head>
<body>
  <main id="app">
    <section class="phone" id="phone">
      <div class="stage" id="stage">
        <div class="content" id="content"></div>
      </div>
      <div class="progress"><span id="progressBar"></span></div>
      <div class="hint">已暂停，松开继续</div>

      <div class="cover" id="cover">
        <div class="cover-inner">
          <h1 class="title">2011，<br>那只水杯</h1>
          <p class="subtitle">人不是一步跌进深渊的，<br>是差一寸没有伸手。</p>
          <button class="primary" id="startBtn">开始</button>
          <p class="muted-note">本预览无配音；成片由本人真声 + 纪录片腔旁白 + 配乐承载。</p>
        </div>
      </div>

      <div class="modal" id="contactModal" aria-hidden="true">
        <div class="modal-inner">
          <h2 class="title">联系杨</h2>
          <p class="subtitle">把你人生里最重要的那个时刻，也做成这样一段路。</p>
          <div class="contact-card">杨微信二维码占位</div>
          <button class="secondary" id="closeModal">返回</button>
        </div>
      </div>

      <div class="landscape">请竖屏观看<br>这段人生</div>
    </section>
  </main>

  <script>
    /* mood:"cold" = 低谷冷蓝；reveal:"lines" = 砍刀一字一顿；mainCards 顺序即播放顺序 */
    const mainCards = [
      { id: "1", type: "center", text: "2011年。\n长沙，红花坡。", fixed: 4000 },
      { id: "2", mood: "cold", small: true, text: "下午两点多，你刚醒。60平米的出租屋，帘子拉着——白天也拉着。屋里唯一的光来自显示器，蓝的。烟灰缸是满的。" },
      { id: "3", text: "又一部电影。你已经不记得这个月看了多少部。1米65，165斤，没穿上衣，肚子搭在桌沿上。" },
      { id: "4", type: "center", text: "你口渴了。", fixed: 3400 },
      { id: "5", small: true, text: "一个黑杯子在桌上，里面泡着一大杯浓茶。离你的手，只有一个拳头的距离。" },
      { id: "5b", small: true, text: "你伸了下手。够不到。得把上身往前送一下，才够得着。" },
      {
        id: "pause-0",
        pause: true,
        title: "就差把上身往前送这一下。\n送，还是不送？",
        choices: [
          { label: "往前够——把茶端过来", branch: "你打算把上身送过去——" },
          { label: "算了，等会儿再说", branch: "等会儿。电影还没完。" }
        ]
      },
      { id: "6", type: "center", text: "身子没有动。", fixed: 4200 },
      { id: "7", small: true, text: "然后，一个画面毫无来由地冒出来——那个故事里的妇人，丈夫把一张大饼挂在她脖子上出了远门。她饿死了。因为懒得把饼转过来。" },
      { id: "7b", type: "center", text: "你突然有一种恐惧。\n像是往下，看见了一个深渊。", fixed: 4200 },
      { id: "7c", type: "center", text: "你就那么停着。\n大概，一分钟。", fixed: 3600 },
      { id: "7d", type: "center", reveal: "lines", text: "再也不能这样过下去了。\n绝对不行。", fixed: 4600 },
      { id: "8", type: "center", text: "35岁。", fixed: 4000 },
      { id: "8b", mood: "cold", small: true, text: "你是初中毕业后考上中专的人——那年头，包分配、吃国家粮。在爸妈眼里，你这辈子稳了，往后是享福的命。\n三十五岁。他们一句怨话都没当面说过。可那点没说出口的失望，你感觉得到。" },
      { id: "9", mood: "cold", small: true, text: "五十公里外就是老家。这座城里住着你的同学、你的熟人，你一个都没联系过。你每天说的话不超过十句：“一包烟。”——对小超市老板。“回锅肉炒饭。”——对小吃店老板。他不用问，你也不用多说。" },
      { id: "10", mood: "cold", small: true, text: "凌晨三四点睡，下午一两点起。楼下小吃店收摊的动静，就是你的午夜报时。靠在网上倒点软件给香港、台湾的客户，每个月能活下来，余不下什么。" },
      { id: "10b", mood: "cold", small: true, text: "你给自己起的网名，是“宅男”。说真的，这个世界跟你没什么关系——你像个过客，一个看客。" },
      { id: "11", text: "你突然想明白一件事，它比任何债主都可怕：\n没有人管你。\n像一片落叶，落下来，没人知道，也没人在意。" },
      { id: "12", text: "如果今天和昨天一样——十年后的今天，也会和今天一样。可是……怎么活？" },
      {
        id: "pause-1",
        pause: true,
        title: "怎么活？",
        choices: [
          { label: "A. 找份工作上班", branch: "35岁，没技能没履历，放到人才市场上，可能没人请你。划掉。" },
          { label: "B. 去做体力活", branch: "你对自己诚实——心里那点不肯说出口的清高，过不去这关。划掉。" },
          { label: "C. 接着倒软件，攒点钱再说", branch: "“再说”这两个字，你已经说了几年了。它的尽头就是那个挂着饼的妇人。划掉。" },
          { label: "D. 走出去——做什么，还不知道", branch: "对。先走出去。" }
        ]
      },
      { id: "13", text: "你翻自己的家底。文凭、技能、人脉、本钱——几乎是空的。" },
      { id: "14", type: "center", text: "但记忆里，\n有一张牌。", fixed: 4000 },
      { id: "15", small: true, text: "村里的大哥，和另外三个人，把一个信托的资金方介绍给一家房地产公司，募了六千万。每人1%中介费——一人六十万。" },
      { id: "16", text: "大哥是村里公认的聪明人。可你上学时，方圆十几里，你都是别的家长口中别人家的孩子。" },
      { id: "17", type: "center", text: "他都可以。\n我为什么不行？", fixed: 4000 },
      {
        id: "pause-2",
        pause: true,
        title: "可你手里是什么，你自己清楚——35岁，没人带，没老师，没本钱，这行你一天没干过。",
        choices: [
          { label: "A. 水太深，没人带着，进去就是给人吃", branch: "奇怪的是，你在心里找这个声音——居然找不到。那段时间，你脑子里没有两个小人打架。只有一个画面，日夜在烧——" },
          { label: "B. 干。把百度当老师，自己砍进去", branch: null }
        ]
      },
      { id: "18", type: "heart", reveal: "lines", fixed: 5600, text: "前面全是荆棘。\n但我要用砍刀，\n砍出一条路来。" },
      { id: "19", text: "你把百度当成老师。什么是信托，什么是过桥，什么是资金方——一个词一个词地查，一页一页地啃。" },
      { id: "20", small: true, text: "出门的时候，兜里多了一个小本子、一支笔。学来的要点抄在前面几页；见了客户、见了同行，边听边记——生怕哪个词没搞懂，被人看出是新来的。多年以后，还有同行笑着问你：杨总，你那个小本子呢？" },
      { id: "21", small: true, text: "然后你听说：有人做承兑，三百万本金，三个月，赚了三百万。这一行，你又是一天没干过。可砍刀既然开了路，没道理在岔口停下。" },
      { id: "22", small: true, text: "你沿着街走，仰着头，把一块块招牌上的电话抄进一部诺基亚——按键上的字母早磨没了，但你一只手打字如飞。一条，一条，发给那些素不相识的老板。" },
      { id: "23", type: "center", text: "“老板，\n我做承兑业务的。”", fixed: 4200 },
      { id: "24", text: "第一单来了。三百万的承兑，你带着资金方做成。客户的办公室里，资金方这单赚了一万多。" },
      { id: "25", text: "临走，他从兜里抽出一张百元钞，甩了过来。“带路费。”" },
      { id: "26", type: "center", text: "三百万的业务。\n一百块的报酬。", fixed: 4200 },
      { id: "27", text: "你接住那张钱，心里没去算多少，也没觉得有什么——只有一个念头，清清楚楚：\n我还成单了。\n路，砍开了第一道口子。" },
      { id: "28", small: true, text: "一年多后，你付了一套房一半的房款——三十多万。卡里还有四十万。两年后你在网上认识一个姑娘，第一次自我介绍，报的就是这两个数。后来，她成了你的妻子。" },
      { id: "29", type: "photo", img: "assets/img/card29.png", audio: "assets/audio/card29.m4a", fixed: 61265, text: "那个没有伸手去拿水杯的下午，到今天，十五年。\n“现在回想起来，其实很恐怖。如果我的人生没有那一次梦醒——按常理来说，大概率是会越来越差的。因为是在一个很封闭的环境下，没有什么变量的加入。甚至夸张一点说，我好像觉得，给我安排的剧本，就是悬崖上的一棵没一点土的小树苗，自己硬生生长出来了。又像是石头下面压的一棵小草，我自己硬生生钻出来的。”" },
      { id: "tail", type: "tail", text: "你的生活里，有没有那张挂在脖子上的饼？", cta: "把你人生里最重要的那个时刻，也做成这样一段路" }
    ];

    const stage = document.getElementById("stage");
    const content = document.getElementById("content");
    const cover = document.getElementById("cover");
    const startBtn = document.getElementById("startBtn");
    const progressBar = document.getElementById("progressBar");
    const phone = document.getElementById("phone");
    const contactModal = document.getElementById("contactModal");
    const closeModal = document.getElementById("closeModal");

    let index = 0;
    let timer = null;
    let pressTimer = null;
    let paused = false;
    let running = false;
    let touchMoved = false;
    let activeAudio = null;

    function durationFor(card) {
      if (card.fixed) return card.fixed;
      const raw = (card.text || card.title || "").replace(/[\s\n，。——、“”【】（）]/g, "");
      return Math.max(3200, raw.length * 280 + 1200);
    }

    function progressValue() {
      const playable = mainCards.filter(card => !card.pause).length;
      const played = mainCards.slice(0, index + 1).filter(card => !card.pause).length;
      return Math.min(100, Math.max(0, (played / playable) * 100));
    }

    function setProgress() {
      progressBar.style.width = `${progressValue()}%`;
    }

    function clearTimer() {
      if (timer) window.clearTimeout(timer);
      timer = null;
    }

    function setMood(card) {
      stage.classList.toggle("cold", card && card.mood === "cold");
    }

    function stopActiveAudio() {
      if (!activeAudio) return;
      activeAudio.pause();
      activeAudio.currentTime = 0;
      activeAudio = null;
    }

    function playCardAudio(card, onEnded, onFallback) {
      stopActiveAudio();
      if (!card.audio) return false;
      const audio = new Audio(card.audio);
      activeAudio = audio;
      let settled = false;
      const fallback = () => {
        if (settled || audio !== activeAudio) return;
        settled = true;
        stopActiveAudio();
        if (typeof onFallback === "function") onFallback();
      };
      audio.addEventListener("ended", () => {
        if (settled || audio !== activeAudio) return;
        settled = true;
        activeAudio = null;
        if (typeof onEnded === "function") onEnded();
      }, { once: true });
      audio.addEventListener("error", fallback, { once: true });
      try {
        const playResult = audio.play();
        if (playResult && typeof playResult.catch === "function") {
          playResult.catch(fallback);
        }
        return true;
      } catch (error) {
        fallback();
        return false;
      }
    }

    function scheduleNext(card) {
      clearTimer();
      if (!running || paused || card.pause || card.type === "tail") return;
      timer = window.setTimeout(nextCard, durationFor(card));
    }

    function buildRevealLines(text) {
      return text.split("\n").map((line, i) =>
        `<span class="reveal-line" style="animation-delay:${i * 0.95}s">${escapeHtml(line)}</span>`
      ).join("");
    }

    function renderCard(card) {
      stage.classList.add("fade");
      window.setTimeout(() => {
        setMood(card);
        const cls = [
          "text",
          card.type === "center" || card.type === "tail" ? "center" : "",
          card.type === "heart" ? "heart" : "",
          card.small ? "small" : ""
        ].filter(Boolean).join(" ");

        let scheduleByDefault = true;

        if (card.pause) {
          stopActiveAudio();
          content.innerHTML = `
            <div class="text small">${escapeHtml(card.title)}</div>
            <div class="kicker">（点一个）</div>
            <div class="choices">
              ${card.choices.map((choice, i) => `<button class="choice" data-choice="${i}">${escapeHtml(choice.label)}</button>`).join("")}
            </div>
          `;
          content.querySelectorAll(".choice").forEach(btn => {
            btn.addEventListener("click", event => {
              event.stopPropagation();
              const choice = card.choices[Number(btn.dataset.choice)];
              handleChoice(choice);
            });
          });
        } else if (card.type === "tail") {
          stopActiveAudio();
          content.innerHTML = `
            <div class="${cls}">${escapeHtml(card.text)}</div>
            <div class="choices">
              <button class="choice" id="contactBtn">${escapeHtml(card.cta)}</button>
            </div>
          `;
          document.getElementById("contactBtn").addEventListener("click", event => {
            event.stopPropagation();
            contactModal.classList.add("show");
            contactModal.setAttribute("aria-hidden", "false");
          });
        } else if (card.type === "photo") {
          const [lead, ...rest] = card.text.split("\n");
          content.innerHTML = `
            <img class="card-photo" src="${escapeHtml(card.img)}" alt=""
                 onerror="this.outerHTML='<div class=&quot;photo-fallback&quot;>〔真容照·落盘后接真实照片〕</div>'">
            <div class="photo-copy">
              <div class="text">${escapeHtml(lead)}</div>
              <div class="text small">${escapeHtml(rest.join("\n"))}</div>
            </div>
          `;
          if (card.audio) {
            scheduleByDefault = false;
            playCardAudio(
              card,
              () => {
                clearTimer();
                timer = window.setTimeout(nextCard, 2000);
              },
              () => scheduleNext(card)
            );
          } else {
            stopActiveAudio();
          }
        } else if (card.reveal === "lines") {
          stopActiveAudio();
          content.innerHTML = `<div class="${cls}">${buildRevealLines(card.text)}</div>`;
        } else {
          stopActiveAudio();
          content.innerHTML = `<div class="${cls}">${escapeHtml(card.text)}</div>`;
        }
        setProgress();
        stage.classList.remove("fade");
        if (scheduleByDefault) scheduleNext(card);
      }, 600);
    }

    function renderBranch(text, nextIndex) {
      stage.classList.add("fade");
      window.setTimeout(() => {
        stopActiveAudio();
        content.innerHTML = `<div class="text small">${escapeHtml(text)}</div>`;
        stage.classList.remove("fade");
        clearTimer();
        timer = window.setTimeout(() => {
          index = nextIndex;
          renderCard(mainCards[index]);
        }, durationFor({ text }));
      }, 600);
    }

    function handleChoice(choice) {
      const nextIndex = index + 1;
      if (choice.branch) {
        renderBranch(choice.branch, nextIndex);
      } else {
        index = nextIndex;
        renderCard(mainCards[index]);
      }
    }

    function nextCard() {
      if (!running || paused) return;
      const card = mainCards[index];
      if (card.pause || card.type === "tail") return;
      index = Math.min(index + 1, mainCards.length - 1);
      renderCard(mainCards[index]);
    }

    function start() {
      running = true;
      paused = false;
      index = 0;
      cover.style.display = "none";
      renderCard(mainCards[index]);
    }

    function pause() {
      if (!running) return;
      paused = true;
      clearTimer();
      if (activeAudio) activeAudio.pause();
      phone.classList.add("paused");
    }

    function resume() {
      if (!running) return;
      paused = false;
      phone.classList.remove("paused");
      if (activeAudio) {
        try {
          const playResult = activeAudio.play();
          if (playResult && typeof playResult.catch === "function") {
            playResult.catch(() => {});
          }
        } catch (error) {}
      }
      scheduleNext(mainCards[index]);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    startBtn.addEventListener("click", start);

    closeModal.addEventListener("click", () => {
      contactModal.classList.remove("show");
      contactModal.setAttribute("aria-hidden", "true");
    });

    stage.addEventListener("pointerdown", () => {
      touchMoved = false;
      pressTimer = window.setTimeout(pause, 520);
    });

    stage.addEventListener("pointermove", () => {
      touchMoved = true;
    });

    stage.addEventListener("pointerup", () => {
      if (pressTimer) window.clearTimeout(pressTimer);
      if (paused) { resume(); return; }
      if (!touchMoved) nextCard();
    });

    stage.addEventListener("pointercancel", () => {
      if (pressTimer) window.clearTimeout(pressTimer);
      if (paused) resume();
    });
  </script>
</body>
</html>
