<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>人生馆001号｜2011，那只水杯</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080807;
      --panel: #11110f;
      --ink: #f2eadb;
      --muted: #b9ad99;
      --cold: #6d8aa4;
      --warm: #d5aa63;
      --line: rgba(255,255,255,.14);
      --shadow: 0 24px 70px rgba(0,0,0,.55);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(129,111,76,.22), transparent 36%),
        linear-gradient(180deg, #171512 0%, #070707 78%);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      overflow: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.07);
      cursor: pointer;
    }

    .app {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .phone {
      width: min(420px, calc(100vw - 28px));
      height: min(820px, calc(100vh - 28px));
      min-height: 640px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 28px;
      background: #0c0c0b;
      box-shadow: var(--shadow);
      isolation: isolate;
      user-select: none;
      touch-action: manipulation;
    }

    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(180deg, rgba(11,13,16,.1), rgba(0,0,0,.58)),
        #111;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--image);
      background-size: cover;
      background-position: center;
      opacity: var(--image-opacity, .88);
      transform: scale(1.03);
      transition: opacity .45s ease, filter .45s ease;
      filter: var(--image-filter, saturate(.82) contrast(1.05) brightness(.82));
      z-index: -2;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 58%, transparent 0 28%, rgba(0,0,0,.54) 76%),
        linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.72));
      z-index: -1;
    }

    .stage.cold::after {
      background:
        radial-gradient(circle at 50% 60%, transparent 0 22%, rgba(0,0,0,.62) 76%),
        linear-gradient(180deg, rgba(12,26,43,.22), rgba(0,0,0,.76));
    }

    .stage.warm::after {
      background:
        radial-gradient(circle at 50% 60%, rgba(214,166,84,.08), transparent 34%, rgba(0,0,0,.55) 78%),
        linear-gradient(180deg, rgba(20,14,7,.14), rgba(0,0,0,.68));
    }

    .hud {
      position: absolute;
      inset: 16px 16px auto;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .progress {
      height: 3px;
      flex: 1;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.16);
    }

    .progress span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cold), var(--warm));
      transition: width .28s ease;
    }

    .sound-toggle {
      width: 42px;
      height: 28px;
      border-radius: 99px;
      background: rgba(0,0,0,.28);
      color: var(--muted);
      font-size: 12px;
      pointer-events: auto;
    }

    .content {
      position: absolute;
      inset: 0;
      display: grid;
      align-content: end;
      gap: 18px;
      padding: 70px 26px 38px;
      z-index: 2;
    }

    .content > :not(.micro-scene) {
      position: relative;
      z-index: 1;
    }

    .kicker {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0;
    }

    .title {
      font-size: 30px;
      line-height: 1.16;
      font-weight: 700;
      text-wrap: balance;
    }

    .text {
      white-space: pre-line;
      font-size: 24px;
      line-height: 1.45;
      font-weight: 650;
      text-shadow: 0 2px 18px rgba(0,0,0,.72);
      text-wrap: balance;
    }

    .text.small {
      font-size: 19px;
      line-height: 1.62;
      font-weight: 560;
    }

    .text.center {
      align-self: center;
      text-align: center;
      font-size: 30px;
      line-height: 1.35;
    }

    .caption {
      display: inline-block;
      width: fit-content;
      max-width: 100%;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 6px;
      background: rgba(0,0,0,.38);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .review-excerpt {
      width: min(100%, 330px);
      padding: 12px 14px 13px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 6px;
      background: rgba(232,237,240,.9);
      color: #131a20;
      box-shadow: 0 18px 44px rgba(0,0,0,.42);
      font-family: "SimSun", "Microsoft YaHei", serif;
      transform: rotate(-.25deg);
    }

    .review-site {
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(27,51,70,.22);
      color: #31506b;
      font-size: 11px;
      line-height: 1.2;
    }

    .review-title {
      margin-top: 8px;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 700;
      color: #0f1720;
    }

    .review-body {
      margin-top: 8px;
      white-space: pre-line;
      font-size: 12px;
      line-height: 1.56;
      color: #2c3740;
    }

    .review-cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      margin-left: 3px;
      background: #26333d;
      vertical-align: -2px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .qq-panel {
      width: min(100%, 330px);
      padding: 11px 12px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px;
      background: rgba(232,237,242,.92);
      color: #111b24;
      box-shadow: 0 18px 44px rgba(0,0,0,.44);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .qq-title {
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(20,44,64,.2);
      color: #1d4d76;
      font-size: 13px;
      font-weight: 700;
    }

    .qq-msg {
      margin-top: 8px;
      padding: 7px 8px;
      border-radius: 5px;
      background: rgba(255,255,255,.72);
      font-size: 12px;
      line-height: 1.42;
      color: #26333d;
    }

    .novel-panel {
      width: min(100%, 330px);
      padding: 11px 12px 12px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px;
      background: rgba(236,232,218,.9);
      color: #151914;
      box-shadow: 0 18px 44px rgba(0,0,0,.44);
      font-family: "SimSun", "Microsoft YaHei", serif;
    }

    .novel-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(38,45,33,.2);
      color: #39452f;
      font-size: 12px;
      line-height: 1.2;
    }

    .novel-list {
      margin-top: 8px;
      display: grid;
      gap: 6px;
      font-size: 12px;
      line-height: 1.4;
      color: #26301f;
    }

    .novel-next {
      margin-top: 9px;
      width: fit-content;
      padding: 5px 9px;
      border: 1px solid rgba(57,69,47,.24);
      border-radius: 5px;
      background: rgba(255,255,255,.56);
      color: #2c3825;
      font-size: 12px;
    }

    .choice {
      width: 100%;
      min-height: 56px;
      padding: 13px 14px;
      border-radius: 8px;
      text-align: left;
      background: rgba(10,10,9,.72);
      backdrop-filter: blur(10px);
      line-height: 1.35;
    }

    .choice:active { transform: translateY(1px); }

    .cover {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      align-content: end;
      gap: 18px;
      padding: 40px 28px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.7)),
        url("assets/img/cover.jpg") center / cover;
    }

    .primary {
      width: 100%;
      min-height: 54px;
      border-radius: 8px;
      background: #f0d5a6;
      color: #1b130b;
      border: 0;
      font-weight: 700;
    }

    .secondary {
      width: 100%;
      min-height: 46px;
      border-radius: 8px;
      background: rgba(0,0,0,.42);
      color: #efe3cf;
      font-size: 14px;
    }

    .muted-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 0;
    }

    .cover-hook {
      margin: 0;
      color: #f3dfb8;
      font-size: 20px;
      line-height: 1.45;
      font-weight: 650;
      text-shadow: 0 2px 18px rgba(0,0,0,.72);
      text-wrap: balance;
    }

    .paused .hint { opacity: 1; }

    .hint {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 8;
      transform: translate(-50%, -50%);
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(0,0,0,.72);
      color: var(--muted);
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }

    .photo-stack {
      align-self: center;
      display: grid;
      gap: 12px;
      margin-bottom: 12px;
    }

    .photo-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    .photo-row img,
    .photo-main {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.16);
      filter: saturate(.86) contrast(1.04);
    }

    .photo-main { max-height: 360px; }

    .frog-drift {
      height: 170px;
      margin-top: -18px;
      border-radius: 16px;
      overflow: hidden;
      opacity: .42;
      filter: saturate(.62) contrast(1.06) brightness(.64);
      position: relative;
      z-index: 1;
    }

    .frog-drift img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.08);
      animation: frogDrift 42s ease-in-out infinite alternate;
    }

    @keyframes frogDrift {
      from { transform: scale(1.08) translate3d(-1.5%, 1%, 0); }
      to   { transform: scale(1.16) translate3d(1.5%, -2%, 0); }
    }

    .truth-note {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px;
      background: rgba(0,0,0,.45);
    }

    .micro-scene {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 24%, rgba(32,61,88,.32), transparent 34%),
        linear-gradient(180deg, #101112 0%, #070707 70%);
    }

    .micro-scene::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 14%;
      width: 68%;
      height: 26%;
      transform: translateX(-50%);
      border: 1px solid rgba(121,162,196,.2);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(80,135,188,.58), rgba(20,31,43,.78)),
        repeating-linear-gradient(0deg, transparent 0 18px, rgba(255,255,255,.06) 18px 19px);
      box-shadow: 0 0 52px rgba(74,126,180,.28);
      opacity: .62;
    }

    .desk {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56%;
      background:
        radial-gradient(ellipse at 56% 18%, rgba(255,255,255,.07), transparent 22%),
        linear-gradient(150deg, #32281e, #15110d 72%);
      transform: perspective(520px) rotateX(5deg);
      transform-origin: bottom;
      box-shadow: inset 0 26px 60px rgba(0,0,0,.46);
    }

    .mess {
      position: absolute;
      border-radius: 6px;
      background: rgba(185,169,132,.16);
      box-shadow: 0 8px 22px rgba(0,0,0,.38);
    }

    .mess.m1 { width: 86px; height: 54px; left: 12%; bottom: 24%; transform: rotate(-8deg); }
    .mess.m2 { width: 62px; height: 84px; right: 16%; bottom: 26%; transform: rotate(11deg); }
    .mess.m3 { width: 96px; height: 18px; left: 30%; bottom: 17%; transform: rotate(4deg); }
    .ash {
      position: absolute;
      left: 20%;
      bottom: 36%;
      width: 72px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle, #5a5146, #171310 72%);
      box-shadow: inset 0 0 16px rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.46);
    }

    .cup {
      position: absolute;
      right: 17%;
      bottom: 32%;
      width: 58px;
      height: 78px;
      border-radius: 9px 9px 18px 18px;
      background:
        radial-gradient(ellipse at 48% 16%, rgba(120,96,65,.9), rgba(25,22,18,.98) 56%),
        linear-gradient(90deg, #0b0a09, #2a211a 52%, #080706);
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: 0 18px 38px rgba(0,0,0,.62);
    }

    .cup::after {
      content: "";
      position: absolute;
      inset: 10px 10px auto auto;
      width: 16px;
      height: 42px;
      border-radius: 12px;
      border: 5px solid rgba(59,45,31,.76);
      border-left: 0;
      transform: translateX(18px);
    }

    .hand {
      position: absolute;
      left: 21%;
      bottom: 23%;
      width: 34%;
      height: 58px;
      border-radius: 40px 26px 22px 40px;
      background: linear-gradient(90deg, #5b3b29, #a97958 76%, #c69471);
      box-shadow: 0 12px 36px rgba(0,0,0,.55);
      transform-origin: left center;
    }

    .hand::after {
      content: "";
      position: absolute;
      right: -20px;
      top: 10px;
      width: 48px;
      height: 14px;
      border-radius: 99px;
      background: #c69471;
      box-shadow:
        0 12px 0 #b98766,
        0 24px 0 #a87658;
    }

    .distance-mark {
      position: absolute;
      left: 54%;
      right: 32%;
      bottom: 38%;
      border-top: 1px dashed rgba(244,224,190,.44);
      opacity: 0;
    }

    .micro-screen .desk { filter: blur(.6px) brightness(.68); }
    .micro-desk::before { opacity: .48; }
    .micro-reach .hand { transform: translateX(22%) rotate(-3deg); }
    .micro-reach .distance-mark { opacity: 1; }
    .micro-freeze .hand { transform: translateX(24%) rotate(-3deg); animation: tremble 1.8s infinite; }
    .micro-freeze .distance-mark { opacity: 1; }
    .micro-still .hand { transform: translateX(-5%) rotate(1deg); opacity: .84; }
    .micro-abyss {
      background: radial-gradient(circle at 50% 30%, rgba(49,76,98,.16), transparent 22%), #010101;
    }
    .micro-abyss::before,
    .micro-abyss .desk,
    .micro-abyss .mess,
    .micro-abyss .ash,
    .micro-abyss .cup,
    .micro-abyss .hand,
    .micro-abyss .distance-mark { opacity: 0; }

    @keyframes tremble {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(.88); }
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* 停顿〇触发器：沿用按钮类名，语义是身体声音，不是剧情分支。 */
    .visual-choice {
      min-height: 176px;
      padding: 0;
      overflow: hidden;
      border-radius: 8px;
      background: rgba(0,0,0,.72);
      text-align: left;
    }

    .visual-choice:disabled {
      opacity: .64;
      cursor: default;
    }

    .choice-scene {
      position: relative;
      height: 110px;
      overflow: hidden;
      background: #090909;
    }

    .choice-scene .micro-scene {
      transform: scale(.72);
      transform-origin: center;
      inset: -50px -62px;
    }

    .choice-copy {
      display: grid;
      gap: 3px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.28;
    }

    .choice-copy strong { font-size: 16px; }

    .pause-animation {
      position: relative;
      min-height: 220px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      background: #050505;
    }

    @media (max-width: 430px) {
      .app { padding: 0; }
      .phone {
        width: 100vw;
        height: 100vh;
        min-height: 100vh;
        border-radius: 0;
        border: 0;
      }
      .content { padding: 64px 22px 34px; }
      .title { font-size: 28px; }
      .text { font-size: 22px; }
      .text.small { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="phone" id="phone">
      <div class="stage" id="stage"></div>
      <div class="hud">
        <div class="progress"><span id="progressBar"></span></div>
        <button class="sound-toggle" id="voiceToggle" aria-label="切换旁白声线">A</button>
      </div>
      <div class="content" id="content"></div>
      <div class="hint">已暂停</div>
      <div class="cover" id="cover">
        <div class="kicker">人生馆001号</div>
        <div class="title">2011，那只水杯</div>
        <p class="cover-hook">他一直觉得这样挺好——直到那只水杯，让他看见自己一动没动。</p>
        <p class="muted-note">戴上耳机，约 5 分钟。</p>
        <button class="primary" id="startBtn">开始</button>
      </div>
    </section>
  </main>

  <script>
    const voiceSets = {
      A: "assets/audio/narration-A/",
      B: "assets/audio/narration-B/"
    };

    let voiceSet = "A";

    // ─── sfx 路径 ───────────────────────────────────────────────
    const SFX = {
      "pack-up":    "assets/audio/sfx/pack-up.mp3",
      "open-up":    "assets/audio/sfx/open-up.mp3",
      "qq":         "assets/audio/sfx/qq.mp3",
      "drop-tone":  "assets/audio/sfx/drop-tone.mp3",
      "single-tone":"assets/audio/sfx/single-tone.mp3",
      "pen":        "assets/audio/sfx/pen.mp3",
      "money":      "assets/audio/sfx/money.mp3",
    };

    // ─── bed / bgm 路径 ──────────────────────────────────────────
    const BED_FILES = {
      fan:    "assets/audio/bed-fan.mp3",
      street: "assets/audio/bed-street.mp3",
    };
    const BGM_FILE = "assets/audio/bgm-warm.mp3";

    const cards = [
      { id: "cover",   kind: "center", mood: "cold", img: "assets/img/cover.jpg", text: "2011年。\n长沙，红花坡。", fixed: 3600 },
      { id: "card-01", img: "assets/img/card-01-v11.png", bed: "fan", caption: "夜尾", text: "凌晨三四点。屏上片子停在最后一帧，吊扇还在转。", fixed: 5200,
        sfx: ["pack-up"] },
      { id: "card-02", mood: "cold", img: "assets/img/card-02-v15.png", bed: "fan", text: "又是下午两三点。\n外面夜宵摊开张。\n你的一天，也开始了。",
        sfx: ["open-up"] },
      { id: "card-03", mood: "cold", img: "assets/img/card-03-v11.png", bed: "fan", audio: "card-03.mp3", novel: { head: ["玄幻小说排行榜", "2011"], rows: ["第九百三十七章  结丹", "退婚 / 斗气 / 逆袭", "笔名栏一闪而过，不可读"], next: "下一章" }, text: "主角从谷底爬起来，打怪，变强，封神。\n又一章。还是昨天那本。" },
      { id: "card-04", mood: "cold", img: "assets/img/card-04-v11.png", bed: "fan", text: "你爱看那种片子。\n看到最后，才知道——\n原来全错了。" },
      { id: "card-05", mood: "cold", img: "assets/img/card-05-v11.png", bed: "fan", caption: "《强殖入侵》影评页", artNote: "v1.5: MTIME影评页标题处清楚露出《强殖入侵》，下面两三行影评正文可读；旁白不念片名、不解释剧情。", review: { site: "Mtime 影评", title: "《强殖入侵》", body: "一个人对一件事坚信不疑。\n到最后，真相完全反过来。\n原来从一开始就错了。", cursor: true }, text: "有一部片子，你一直忘不掉。\n一个人坚信不疑。\n到最后，真相完全反过来。\n你写完影评，发上去。\n光标还在闪。" },
      { id: "card-06", mood: "cold", img: "assets/img/card-06-v11.png", bed: "fan", qq: { title: "92级初中同学", messages: ["恭喜刘同学喜提新车！", "恭喜王同学买了新房！"] }, text: "92级初中同学群，又亮了。\n有人恭喜同学喜提新车。\n有人恭喜同学买了新房。\n你看了一眼，点掉。\n心里咯噔一下。\n又把它按回去：\n有什么了不起。\n活得那么累，那么俗。",
        sfx: ["qq"] },
      { id: "card-07", mood: "cold", img: "assets/img/card-07-v11.png", bed: "fan", review: { site: "Mtime 影评", title: "《强殖入侵》", body: "名和利，本来就不值得追求。\n到头来，皆是虚幻。\n精神上不空，也就够了。", cursor: false }, text: "这套话，你写在影评里，\n也在心里说过很多遍。\n那不是装的。\n那时候，你是真的信。" },

      { id: "card-08",  mood: "cold", img: "assets/img/card-08-v15.png",  bed: "fan", caption: "屏外", artNote: "v1.5: 重出图时补椅子里瘫坐、裸上身或背心掀起、大肚子明显；身体证据只进画面，不进旁白。", text: "屏幕还亮着。\n封神、逆袭、挺好。\n视线从屏上移开。", fixed: 5200 },
      { id: "card-08b", mood: "cold", img: "assets/img/card-08-v15.png",  bed: "fan", caption: "桌面", text: "烟灰、泡面桶、纸巾团。\n蓝光打在这一桌黏腻上。", fixed: 4800 },
      { id: "card-09",  mood: "cold", img: "assets/img/card-09-v15.png",  bed: "fan", caption: "口渴", text: "桌角那只黑旧的杯子。\n手，下意识探过去。", fixed: 4600 },
      { id: "card-10",  mood: "cold", img: "assets/img/card-10-v15.png",  bed: "fan", sound: "thin", caption: "二三拳头", artNote: "v1.5: 侧面够杯，肚子先顶出来，身子没离开椅背，手伸一点又停住。", text: "够得到。\n只是，要动一下身子。", fixed: 6200 },
      {
        id: "pause-0",
        pause: true,

      },
      { id: "card-11", mood: "cold", img: "assets/img/card-11-v15.png", bed: "silence", sound: "silence", audio: "card-11.mp3", text: "手缩回去了。\n\n身子，没有动。", fixed: 4200 },
      { id: "card-12", mood: "cold", img: "assets/img/card-12-v11.png", sound: "drop",    text: "一个画面闪出来。\n一个妇人，脖子上挂着饼。\n低一下头就能吃。\n可她没动。\n后来，她饿死了。", fixed: 9800,
        sfx: ["drop-tone"] },
      { id: "card-13", mood: "cold", img: "assets/img/card-13-v11.png", sound: "drop",    text: "", fixed: 4800 },
      { id: "card-14", mood: "cold", img: "assets/img/card-14-v11.png", sound: "silence", text: "你就那么停着。\n\n大概一分钟。", fixed: 5200 },
      { id: "card-15", kind: "center", mood: "cold", img: "assets/img/card-15-v11.png", sound: "silence", audio: "card-15.mp3", text: "再也不能这样过下去了！\n\n绝对不行！！！", fixed: 6200 },

      { id: "card-15b", mood: "cold", img: "assets/img/card-15-v11.png", text: "你忽然想：怎么会成这样？\n再这样下去，这一辈子，会变成什么样？\n那一下，身上发冷。\n你开始反复想，根到底在哪。\n网上有朋友，也有客户，热热闹闹。\n可屏幕一黑，现实里，几乎没人认识你。\n你不是没路。你是太久没有出去。", fixed: 12800 },

      { id: "card-16", mood: "warm", img: "assets/img/card-16-v11.png", text: "那就先出去。\n不是为了马上赚钱。\n是不能再这样待下去。\n再待下去，动一下身子，都会越来越难。\n你得先从这把椅子里出来。\n走出门，抬头——高楼一幢接一幢，路上车水马龙。\n不知道多少个亿，就在这座城里流动。\n你忽然觉得：这个世界不是空的。\n路、人、钱，都在动。\n你要的，其实也没那么大——\n在长沙，有辆车，有套房，能站住脚。\n理论上，好像也不是天上的事。", fixed: 17800 },
      { id: "card-16b", mood: "warm", img: "assets/img/card-16-v11.png", text: "可问题是——出来以后，靠什么活？\n去上班？啥也不会，没人请。\n去下力气？心里那点清高，又过不去。\n继续倒腾那点软件？还是那点钱，养不活自己。", fixed: 11200 },
      { id: "card-17a", mood: "warm", img: "assets/img/card-17-v11.png", text: "可往哪动？\n你想起村里那个大哥。\n没读过几年书，伙着三四个人，把一笔信托对接给房地产，募了六千万。\n分一个点，六十万到手。\n你真正看见的，不是那六十万。\n是这件事，原来走得通。", fixed: 13200 },
      { id: "card-17b", mood: "warm", img: "assets/img/card-17-v11.png", text: "你心里那笔账，算得清清楚楚：\n他没读过几年书，都能做成。\n你呢——上过学，会电脑，会上网，当年在方圆十几里，还是出了名的学生偶像。\n他能，说明这条路就走得通。\n那你，凭什么不行？", fixed: 11800 },
      { id: "card-18", kind: "center", mood: "warm", img: "assets/img/card-18-v11.png", text: "你没等看清整条路。\n前面全是荆棘，看不清。\n但那时候，你只认一件事：\n先动。\n先试。\n手里有把刀，就先砍眼前这一茬。\n砍开一点，往前挪一点。\n又挡住了，再砍。",
        sfx: ["single-tone"], fixed: 10800 },
      { id: "card-18b", mood: "warm", img: "assets/img/card-18-v11.png", text: "刀往哪砍？\n你把百度当老师，一个词一个词地啃：承兑、信托、资金方。\n然后线上线下，一家家对接。\n头两单，真成了，挣了五六万。", fixed: 11200 },
      { id: "card-19", mood: "warm", img: "assets/img/card-19-v11.png", text: "你兜里揣个小本子，前几页抄满要点。\n生怕哪个词没懂，被人看出是新来的。\n沿街一家家，仰头把招牌上的电话抄进手机。\n回去一条条群发：老板，我做承兑业务的。",
        sfx: ["pen"], fixed: 11600 },
      { id: "card-20", mood: "warm", img: "assets/img/card-20-v11.png", text: "跑了不知多少家，第一单来了。\n三百万的承兑，你带着资金方做成。\n资金方赚了万把块，临走甩给你一张一百块：带路费。\n那时候你还穷，也还清高。\n这钱对不对，你没算。\n你只记住一件事：我还成单了。\n路，砍开了第一道口子。",
        sfx: ["money"], fixed: 11800 },

      {
        id: "card-21",
        mood: "cold",
        kind: "photo",
        img: "assets/img/card21-photo.png",
        frog: "assets/img/card21-frog-warmwater-v15.png",
        audioFull: "assets/audio/card21.m4a",
        fixed: 109500,
        text: "那个下午，到今天，十五年了。\n背脊还是会发凉。\n那时候一点都不觉得有问题。\n是真的感觉挺充实的。\n屏幕一关，现实里，其实就剩一个人。\n不是想通了。\n是被自己吓醒了。\n人生其实还有另一种走法。"
      },
      {
        id: "card-22",
        kind: "center",
        mood: "warm",
        img: "assets/img/tail.jpg",
        text: "你有没有过这样的时刻？\n\n有一件事，\n你一直觉得挺正常。\n\n甚至，挺充实。\n\n直到有一个很小的东西，\n忽然照了你一下。\n\n你才发现——\n\n自己可能已经很久，\n没有真正出去了。",
        fixed: 8600
      }
    ];

    const stage      = document.getElementById("stage");
    const content    = document.getElementById("content");
    const cover      = document.getElementById("cover");
    const startBtn   = document.getElementById("startBtn");
    const progressBar= document.getElementById("progressBar");
    const phone      = document.getElementById("phone");
    const voiceToggle= document.getElementById("voiceToggle");

    let index       = 0;
    let timer       = null;
    let activeAudio = null;
    let running     = false;
    let paused      = false;
    let pressTimer  = null;
    let touchMoved  = false;
    let audioContext= null;
    let soundNodes  = [];

    // ─── Bed / BGM state ────────────────────────────────────────
    let bedAudio       = null;
    let bgmAudio       = null;
    let currentBedType = null;   // tracks running bed type to avoid restarts
    let bgmRunning     = false;

    // ─── Helpers ────────────────────────────────────────────────
    function escapeHtml(v) {
      return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function setImage(card) {
      stage.classList.toggle("has-visual", !!(card && card.visual));
      stage.style.setProperty("--image", card && card.img ? `url("${card.img}")` : "none");
      stage.style.setProperty("--image-opacity", card && card.imgOpacity !== undefined ? card.imgOpacity : ".88");
      stage.style.setProperty("--image-filter", card && card.imgFilter ? card.imgFilter : "saturate(.82) contrast(1.05) brightness(.82)");
      stage.classList.toggle("cold", card && card.mood === "cold");
      stage.classList.toggle("warm", card && card.mood === "warm");
    }

    // ─── Oscillator soundscape (unchanged, for drop / thin) ─────
    function stopSoundscape() {
      soundNodes.forEach(n => { try { if(n.stop) n.stop(); if(n.disconnect) n.disconnect(); } catch(e){} });
      soundNodes = [];
    }

    function startSoundscape(type) {
      stopSoundscape();
      // fan / street are handled by file-based bed; silence = nothing
      if (!type || type === "silence" || type === "fan" || type === "street") return;
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") audioContext.resume().catch(()=>{});
      const gain = audioContext.createGain();
      gain.gain.value = type === "drop" ? 0.03 : type === "thin" ? 0.018 : 0.026;
      gain.connect(audioContext.destination);
      const osc = audioContext.createOscillator();
      osc.type = "sine";
      osc.frequency.value = type === "drop" ? 48 : type === "thin" ? 82 : 66;
      osc.connect(gain); osc.start();
      soundNodes.push(osc, gain);
      if (type === "drop") {
        const lfoGain = audioContext.createGain();
        const lfo = audioContext.createOscillator();
        lfo.frequency.value = 0.55; lfoGain.gain.value = 11;
        lfo.connect(lfoGain); lfoGain.connect(osc.frequency); lfo.start();
        soundNodes.push(lfo, lfoGain);
      }
    }

    // ─── File-based bed ─────────────────────────────────────────
    function startBed(type) {
      if (type === currentBedType) return;   // already playing this bed
      currentBedType = type;

      if (bedAudio) { bedAudio.pause(); bedAudio = null; }

      const src = BED_FILES[type];
      if (!src) return;

      const a = new Audio(src);
      a.loop   = true;
      a.volume = 0.14;
      bedAudio = a;
      a.play().catch(() => {
        // fallback: oscillator hum
        startSoundscape(type);
      });
    }

    function stopBed() {
      currentBedType = null;
      if (bedAudio) { bedAudio.pause(); bedAudio = null; }
    }

    // ─── BGM ────────────────────────────────────────────────────
    function startBgm() {
      if (bgmRunning) return;
      bgmRunning = true;
      const a = new Audio(BGM_FILE);
      a.loop   = true;
      a.volume = 0.09;
      bgmAudio = a;
      a.play().catch(() => {});
    }

    function stopBgm() {
      bgmRunning = false;
      if (bgmAudio) { bgmAudio.pause(); bgmAudio = null; }
    }

    // ─── SFX one-shot ───────────────────────────────────────────
    function playSfx(keys) {
      if (!keys || !keys.length) return;
      keys.forEach(key => {
        const src = SFX[key];
        if (!src) return;
        const a = new Audio(src);
        a.volume = 0.68;
        a.play().catch(() => {});
      });
    }

    // ─── Audio lifecycle ────────────────────────────────────────
    function stopAudio() {
      if (activeAudio) { activeAudio.pause(); activeAudio = null; }
      stopSoundscape();
      // NOTE: bed and bgm are NOT stopped here; they persist across cards
    }

    function stopAllAudio() {
      stopAudio();
      stopBed();
      stopBgm();
    }

    function durationFor(card) {
      if (card.fixed) return card.fixed;
      const chars = (card.text||"").replace(/\s/g,"").length;
      return Math.max(3800, Math.min(12000, 2200 + chars * 180));
    }

    function progressValue() {
      const playable = cards.filter(c => !c.pause).length;
      const played   = cards.slice(0, index + 1).filter(c => !c.pause).length;
      return Math.min(100, Math.max(0, (played / playable) * 100));
    }

    function updateProgress() {
      progressBar.style.width = `${progressValue()}%`;
    }

    function playAudio(card, done) {
      if (activeAudio) { activeAudio.pause(); activeAudio = null; }
      const src = card.audioFull || (card.audio ? `${voiceSets[voiceSet]}${card.audio}` : "");
      if (!src) return false;
      const audio = new Audio(src);
      activeAudio = audio;
      let settled = false;
      const fallback = () => { if (settled || audio !== activeAudio) return; settled=true; done(false); };
      audio.addEventListener("ended", () => { if (settled || audio !== activeAudio) return; settled=true; done(true); });
      audio.addEventListener("error", fallback, { once: true });
      audio.play().catch(fallback);
      return true;
    }

    function schedule(card) {
      clearTimeout(timer);
      if (!running || paused || card.pause || index >= cards.length - 1) return;
      timer = window.setTimeout(next, durationFor(card));
    }

    function visualMarkup(name) {
      if (name === "black") return "";
      const cls = { screen:"micro-screen", desk:"micro-desk", cup:"micro-cup",
        reach:"micro-reach", freeze:"micro-freeze", still:"micro-still", abyss:"micro-abyss" }[name] || "micro-desk";
      return `<div class="micro-scene ${cls}" aria-hidden="true">
        <div class="desk"></div><div class="mess m1"></div><div class="mess m2"></div>
        <div class="mess m3"></div><div class="ash"></div><div class="cup"></div>
        <div class="hand"></div><div class="distance-mark"></div></div>`;
    }

    function reviewMarkup(card) {
      if (!card.review) return "";
      return `<div class="review-excerpt">
        <div class="review-site">${escapeHtml(card.review.site)}</div>
        <div class="review-title">${escapeHtml(card.review.title)}</div>
        <div class="review-body">${escapeHtml(card.review.body)}${card.review.cursor ? `<span class="review-cursor"></span>` : ""}</div>
      </div>`;
    }

    function qqMarkup(card) {
      if (!card.qq) return "";
      return `<div class="qq-panel">
        <div class="qq-title">${escapeHtml(card.qq.title)}</div>
        ${(card.qq.messages || []).map(msg => `<div class="qq-msg">${escapeHtml(msg)}</div>`).join("")}
      </div>`;
    }

    function novelMarkup(card) {
      if (!card.novel) return "";
      const head = card.novel.head || [];
      return `<div class="novel-panel">
        <div class="novel-head"><span>${escapeHtml(head[0] || "玄幻小说")}</span><span>${escapeHtml(head[1] || "")}</span></div>
        <div class="novel-list">${(card.novel.rows || []).map(row => `<div>${escapeHtml(row)}</div>`).join("")}</div>
        ${card.novel.next ? `<div class="novel-next">${escapeHtml(card.novel.next)}</div>` : ""}
      </div>`;
    }

    function renderVisual(card) {
      content.innerHTML = `
        ${visualMarkup(card.visual)}
        ${card.caption ? `<div class="caption">${escapeHtml(card.caption)}</div>` : ""}
        ${reviewMarkup(card)}
        ${qqMarkup(card)}
        ${novelMarkup(card)}
        <div class="text ${card.kind==="center"?"center":"small"}">${escapeHtml(card.text)}</div>`;
    }

    function renderPhoto(card) {
      content.innerHTML = `
        <div class="photo-stack">
          <img class="photo-main" src="${escapeHtml(card.img)}" alt="">
          ${card.frog ? `<div class="frog-drift" aria-hidden="true"><img src="${escapeHtml(card.frog)}" alt=""></div>` : ""}
          <div class="photo-row">
            <div class="truth-note">
              <div class="kicker">真人真声</div>
              <div class="caption">无 AI 克隆。保留停顿、不顺和口语节奏。</div>
            </div>
          </div>
        </div>
        <div class="text small">${escapeHtml(card.text)}</div>`;
    }

    function render(card) {
      clearTimeout(timer);
      stopAudio();   // stops narration + oscillators; bed & bgm persist
      updateProgress();
      setImage(card);

      // ── 声音路由 ──────────────────────────────────────────────
      const bedType = card.bed;
      if (bedType === "fan" || bedType === "street") {
        startBed(bedType);
      } else if (bedType === "silence") {
        stopBed();
      } else if (bedType === undefined) {
        // no change to bed
      } else {
        stopBed();
      }

      const soundType = card.sound;
      if (soundType === "silence" || soundType === undefined) {
        stopSoundscape();
      } else {
        startSoundscape(soundType);    // oscillator for drop / thin
      }

      if (card.mood === "warm") {
        startBgm();
      } else if (card.mood === "cold") {
        stopBgm();
      }

      // ── sfx 一次性音效 ────────────────────────────────────────
      playSfx(card.sfx);

      if (card.pause) {
        content.innerHTML = `
          ${visualMarkup(card.visual)}
          <div class="choice-grid" aria-label="两个身体声音触发器">
            <button class="visual-choice" id="btn-reach">
              <div class="choice-scene">${visualMarkup("reach")}</div>
              <div class="choice-copy"><strong>把身子送出去</strong></div>
            </button>
            <button class="visual-choice" id="btn-still">
              <div class="choice-scene">${visualMarkup("still")}</div>
              <div class="choice-copy"><strong>真的不想动</strong></div>
            </button>
          </div>`;
        content.querySelectorAll(".visual-choice").forEach(btn => {
          btn.addEventListener("click", () => handlePauseTrigger(card));
        });
        return;
      }

      if (card.kind === "photo") {
        renderPhoto(card);
      } else if (card.visual) {
        renderVisual(card);
      } else {
        const cls = `text ${card.kind==="center"?"center":"small"}`;
        content.innerHTML = `
          ${card.caption ? `<div class="caption">${escapeHtml(card.caption)}</div>` : ""}
          ${reviewMarkup(card)}
          ${qqMarkup(card)}
          ${novelMarkup(card)}
          <div class="${cls}">${escapeHtml(card.text)}</div>`;
      }

      const hasAudio = playAudio(card, ok => {
        if (ok) { timer = window.setTimeout(next, 900); }
        else     { schedule(card); }
      });
      if (!hasAudio) schedule(card);
    }

    function next() {
      if (!running) return;
      if (index >= cards.length - 1) return;
      index = Math.min(index + 1, cards.length - 1);
      render(cards[index]);
    }

    function handlePauseTrigger(card) {
      content.querySelectorAll(".visual-choice").forEach(btn => {
        btn.disabled = true;
      });

      const sequence = ["reach", "still", "reach", "still", "freeze"];
      let frame = 0;
      const renderFrame = () => {
        const view = sequence[frame];
        content.innerHTML = `
          <div class="pause-animation">${visualMarkup(view)}</div>`;
        if (frame < sequence.length - 1) {
          frame += 1;
          timer = window.setTimeout(renderFrame, 600);
        } else {
          timer = window.setTimeout(() => jumpTo("card-11"), 1200);
        }
      };
      renderFrame();
    }

    function jumpTo(id) {
      const nextIndex = cards.findIndex(c => c.id === id);
      index   = nextIndex >= 0 ? nextIndex : 0;
      running = true;
      paused  = false;
      cover.style.display = "none";
      render(cards[index]);
    }

    function start() {
      running = true;
      paused  = false;
      cover.style.display = "none";
      index   = 0;
      render(cards[index]);
    }

    function pause() {
      if (!running || paused) return;
      paused = true;
      clearTimeout(timer);
      if (activeAudio) activeAudio.pause();
      if (bedAudio)    bedAudio.pause();
      if (bgmAudio)    bgmAudio.pause();
      phone.classList.add("paused");
    }

    function resume() {
      if (!running || !paused) return;
      paused = false;
      phone.classList.remove("paused");
      if (activeAudio) activeAudio.play().catch(()=>{});
      if (bedAudio)    bedAudio.play().catch(()=>{});
      if (bgmAudio)    bgmAudio.play().catch(()=>{});
      if (!activeAudio) schedule(cards[index]);
    }

    startBtn.addEventListener("click", start);

    voiceToggle.addEventListener("click", e => {
      e.stopPropagation();
      voiceSet = voiceSet === "A" ? "B" : "A";
      voiceToggle.textContent = voiceSet;
    });

    phone.addEventListener("pointerdown", () => { touchMoved=false; pressTimer=window.setTimeout(pause,520); });
    phone.addEventListener("pointermove", () => { touchMoved=true; clearTimeout(pressTimer); });
    phone.addEventListener("pointerup",   () => {
      clearTimeout(pressTimer);
      if (!running || touchMoved) return;
      if (paused) { resume(); return; }
      const card = cards[index];
      if (!card.pause) next();
    });
    phone.addEventListener("pointerleave", () => clearTimeout(pressTimer));
  </script>
