<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>人生馆001号 · 2011，那只水杯 · v1.1</title>
  <style>
    :root {
      --bg: #070706;
      --fg: #f5efe4;
      --muted: rgba(245, 239, 228, 0.68);
      --line: rgba(245, 239, 228, 0.18);
      --accent: #d8b76f;
      --cold: #6f8aa8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
    }

    .phone {
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      overflow: hidden;
      background: var(--bg);
      isolation: isolate;
    }

    .stage {
      position: absolute;
      inset: 0;
      padding: calc(34px + var(--safe-top)) 24px calc(42px + var(--safe-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: left;
      opacity: 1;
      transition: opacity 0.52s ease;
    }

    .stage.fade { opacity: 0; }

    .bg-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.025), transparent 28%),
        radial-gradient(circle at 50% 72%, rgba(216, 183, 111, 0.08), transparent 45%),
        #070706;
      transition: background 0.8s ease, filter 0.8s ease;
    }

    .bg-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 48%, transparent 0%, transparent 42%, rgba(0,0,0,0.62) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.42));
      pointer-events: none;
    }

    .bg-night-off { background:
      radial-gradient(circle at 48% 30%, rgba(72, 94, 116, 0.16), transparent 34%),
      linear-gradient(180deg, #090b0d 0%, #030304 100%); }
    .bg-blue-room { background:
      radial-gradient(circle at 52% 46%, rgba(74, 118, 165, 0.2), transparent 38%),
      linear-gradient(180deg, #0a0d11 0%, #050608 100%); }
    .bg-screen { background:
      radial-gradient(circle at 50% 36%, rgba(86, 136, 188, 0.22), transparent 34%),
      linear-gradient(180deg, #0c1015 0%, #050608 100%); }
    .bg-desk-dirty { background:
      radial-gradient(circle at 46% 55%, rgba(92, 86, 72, 0.24), transparent 40%),
      linear-gradient(180deg, #0a0b0d 0%, #050404 100%); }
    .bg-cup { background:
      radial-gradient(circle at 58% 56%, rgba(90, 87, 72, 0.26), transparent 30%),
      linear-gradient(180deg, #09090a 0%, #050505 100%); }
    .bg-silence { background:
      radial-gradient(circle at 50% 52%, rgba(50, 56, 64, 0.12), transparent 34%),
      linear-gradient(180deg, #050506 0%, #010101 100%); }
    .bg-abyss { background:
      radial-gradient(circle at 50% 18%, rgba(55, 72, 92, 0.16), transparent 26%),
      linear-gradient(180deg, #07080a 0%, #000 78%); }
    .bg-door { background:
      radial-gradient(circle at 50% 24%, rgba(230, 210, 158, 0.32), transparent 30%),
      linear-gradient(180deg, #1a1710 0%, #090806 100%); }
    .bg-street { background:
      radial-gradient(circle at 52% 44%, rgba(216, 183, 111, 0.23), transparent 40%),
      linear-gradient(180deg, #14100a 0%, #070604 100%); }
    .bg-knife { background:
      radial-gradient(circle at 50% 42%, rgba(216, 183, 111, 0.32), transparent 34%),
      linear-gradient(180deg, #100e09 0%, #050403 100%); }
    .bg-notebook { background:
      radial-gradient(circle at 48% 52%, rgba(216, 183, 111, 0.2), transparent 36%),
      linear-gradient(180deg, #11100d 0%, #060504 100%); }
    .bg-money { background:
      radial-gradient(circle at 50% 52%, rgba(216, 183, 111, 0.28), transparent 38%),
      linear-gradient(180deg, #151009 0%, #070504 100%); }
    .bg-witness { background:
      radial-gradient(circle at 50% 38%, rgba(245, 239, 228, 0.1), transparent 32%),
      linear-gradient(180deg, #0b0a08 0%, #030303 100%); }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255,255,255,0.01) 1px, transparent 1px);
      background-size: 34px 34px;
      opacity: 0.28;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 560px;
    }

    .kicker {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .text {
      font-size: clamp(25px, 6.3vw, 39px);
      line-height: 1.46;
      font-weight: 560;
      text-wrap: balance;
      white-space: pre-line;
      text-shadow: 0 2px 18px rgba(0,0,0,0.6);
    }

    .text.small {
      font-size: clamp(20px, 5.15vw, 29px);
      line-height: 1.55;
      font-weight: 500;
      color: rgba(245, 239, 228, 0.94);
    }

    .text.center {
      text-align: center;
      font-size: clamp(33px, 9.5vw, 58px);
      line-height: 1.18;
      font-weight: 720;
    }

    .text.heart {
      text-align: center;
      font-size: clamp(29px, 8.2vw, 52px);
      line-height: 1.28;
      font-weight: 780;
    }

    .reveal-line {
      display: block;
      opacity: 0;
      transform: translateY(8px);
      animation: lineIn 0.85s ease forwards;
    }

    @keyframes lineIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .card-photo {
      display: block;
      width: min(78%, 360px);
      max-height: 40vh;
      margin: 0 auto 24px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid rgba(245, 239, 228, 0.22);
      box-shadow: 0 18px 55px rgba(0,0,0,0.5);
    }

    .photo-fallback {
      display: grid;
      place-items: center;
      width: min(78%, 360px);
      height: 30vh;
      margin: 0 auto 24px;
      border: 1px solid rgba(245, 239, 228, 0.2);
      border-radius: 4px;
      color: rgba(245, 239, 228, 0.5);
      font-size: 14px;
      background: rgba(255,255,255,0.04);
    }

    .photo-copy { display: grid; gap: 14px; }

    .choices {
      display: grid;
      gap: 14px;
      margin-top: 24px;
    }

    .choice {
      width: 100%;
      min-height: 58px;
      padding: 15px 16px;
      border: 1px solid rgba(245, 239, 228, 0.24);
      border-radius: 8px;
      background: rgba(245, 239, 228, 0.08);
      text-align: left;
      font-size: clamp(18px, 4.7vw, 24px);
      line-height: 1.35;
      backdrop-filter: blur(8px);
    }

    .choice:active {
      background: rgba(216, 183, 111, 0.18);
      border-color: rgba(216, 183, 111, 0.52);
    }

    .image-choices {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    .image-choice {
      position: relative;
      min-height: 168px;
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(245, 239, 228, 0.24);
      border-radius: 8px;
      background: #111;
      text-align: left;
    }

    .image-choice .choice-art {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(60,66,74,0.7), rgba(8,8,8,0.96));
    }

    .image-choice[data-art="reach"] .choice-art {
      background:
        radial-gradient(circle at 68% 58%, rgba(160, 145, 105, 0.38), transparent 20%),
        linear-gradient(135deg, rgba(86, 92, 96, 0.78), rgba(8,8,8,0.96));
    }

    .image-choice[data-art="sink"] .choice-art {
      background:
        radial-gradient(circle at 28% 36%, rgba(70, 112, 155, 0.34), transparent 24%),
        linear-gradient(135deg, rgba(16, 18, 23, 0.92), rgba(4,4,4,0.98));
    }

    .image-choice .choice-label {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 12px;
      z-index: 1;
      color: rgba(245, 239, 228, 0.92);
      font-size: clamp(17px, 4.5vw, 23px);
      line-height: 1.35;
      text-shadow: 0 2px 14px rgba(0,0,0,0.85);
    }

    .progress {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 2px;
      z-index: 5;
      background: rgba(245, 239, 228, 0.1);
    }
    .progress > span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width 0.3s linear;
    }

    .hint {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: calc(18px + var(--safe-bottom));
      z-index: 4;
      color: rgba(245, 239, 228, 0.48);
      font-size: 12px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .paused .hint { opacity: 1; }

    .cover, .landscape {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 26px;
      background:
        radial-gradient(circle at 50% 34%, rgba(216, 183, 111, 0.16), transparent 34%),
        linear-gradient(180deg, #11100d, #050504);
    }

    .cover-inner { width: 100%; text-align: center; }

    .title {
      margin: 0 0 18px;
      font-size: clamp(35px, 10vw, 60px);
      line-height: 1.08;
      font-weight: 820;
    }

    .tag {
      margin: 0 0 14px;
      color: rgba(245, 239, 228, 0.58);
      font-size: 14px;
      letter-spacing: 0.08em;
    }

    .quote {
      margin: 0 auto 28px;
      max-width: 320px;
      color: rgba(245, 239, 228, 0.78);
      font-size: clamp(16px, 4.2vw, 22px);
      line-height: 1.55;
    }

    .primary {
      min-width: 148px;
      min-height: 54px;
      padding: 13px 22px;
      border-radius: 8px;
      background: var(--fg);
      color: #11100d;
      font-size: 20px;
      font-weight: 720;
    }

    .muted-note {
      margin-top: 18px;
      color: rgba(245, 239, 228, 0.42);
      font-size: 12px;
      line-height: 1.5;
    }

    .landscape {
      display: none;
      z-index: 30;
      text-align: center;
      font-size: 22px;
      line-height: 1.5;
    }

    @media (orientation: landscape) and (max-height: 640px) {
      .landscape { display: flex; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage { transition: opacity 0.2s ease; }
      .reveal-line { animation-duration: 0.01s; }
    }
  </style>
</head>
<body>
  <main id="app">
    <section class="phone" id="phone">
      <div class="stage" id="stage">
        <div class="bg-layer" id="bgLayer"></div>
        <div class="grain"></div>
        <div class="content" id="content"></div>
      </div>
      <div class="progress"><span id="progressBar"></span></div>
      <div class="hint">已暂停，松开继续</div>

      <div class="cover" id="cover">
        <div class="cover-inner">
          <h1 class="title">2011，<br>那只水杯</h1>
          <p class="tag">2011 · 长沙红花坡</p>
          <p class="quote">他以为自己活通透了——直到那只水杯，没够着。</p>
          <button class="primary" id="startBtn">开始</button>
          <p class="muted-note">戴耳机更好。第一可跑版：卡1-22，图与声音可占位。</p>
        </div>
      </div>

      <div class="landscape">请竖屏观看<br>这段人生</div>
    </section>
  </main>

  <script>
    const BED_TRACKS = {
      fan: "assets/audio/bed-fan-placeholder.m4a",
      street: "assets/audio/bed-street-placeholder.m4a"
    };

    const BGM_TRACKS = {
      warm: "assets/audio/bgm-warm-placeholder.m4a"
    };

    const cards = [
      {
        id: "1",
        bg: "night-off",
        bed: "fan",
        fixed: 5200,
        text: ""
      },
      {
        id: "2",
        bg: "blue-room",
        bed: "fan",
        small: true,
        text: "又是下午两三点。\n外面夜宵摊开张，\n你的一天，也开张了。"
      },
      {
        id: "3",
        bg: "screen",
        bed: "fan",
        small: true,
        text: "主角从谷底爬起来，打怪，变强，封神。\n又一章。\n还是昨天那本。"
      },
      {
        id: "4",
        bg: "screen",
        bed: "fan",
        small: true,
        text: "你最爱看的，是那种到最后才发现——\n原来全错了的片子。"
      },
      {
        id: "5",
        bg: "screen",
        bed: "fan",
        small: true,
        text: "有一部片子你一直忘不掉。\n一个人，坚信不疑的东西，真相却完全反过来。\n你刚写完它的影评，挂在网上。\n你觉得自己看得比谁都深。"
      },
      {
        id: "6",
        bg: "blue-room",
        bed: "fan",
        small: true,
        text: "同在这座长沙城里，同学们有房有车，孩子都上小学了。\n你心里咯噔一下——又马上按下去：\n有什么了不起，活得那么累，那么俗。"
      },
      {
        id: "7",
        bg: "screen",
        bed: "fan",
        small: true,
        text: "这话，你写在影评里，\n也跟自己说了很多遍。\n说到——你自己都信了。"
      },
      {
        id: "8",
        bg: "desk-dirty",
        bed: "fan",
        fixed: 5200,
        text: ""
      },
      {
        id: "9",
        bg: "cup",
        bed: "fan",
        fixed: 4400,
        text: ""
      },
      {
        id: "10",
        bg: "cup",
        bed: "fan",
        fixed: 4600,
        text: "手悬在半空。\n杯子还在二三拳头外。\n要够着，得整个上身离开椅背，往前送一大下。"
      },
      {
        id: "pause-0",
        bg: "silence",
        silent: true,
        pause: true,
        choiceType: "image",
        title: "",
        choices: [
          {
            label: "上身前倾，指尖快碰到那只脏杯子",
            art: "reach",
            feedback: "可那天，他没有。"
          },
          {
            label: "手收回来，人陷回椅子，视线回到屏幕",
            art: "sink",
            feedback: null
          }
        ]
      },
      {
        id: "11",
        bg: "silence",
        silent: true,
        type: "center",
        text: "身子，\n没有动。",
        fixed: 3800
      },
      {
        id: "12",
        bg: "silence",
        silent: true,
        small: true,
        text: "一个画面毫无来由地冒出来——\n那个妇人，丈夫把大饼挂在她脖子上出了远门。\n她饿死了。\n因为懒得把饼转过来。"
      },
      {
        id: "13",
        bg: "abyss",
        silent: true,
        fixed: 5000,
        text: ""
      },
      {
        id: "14",
        bg: "abyss",
        silent: true,
        type: "center",
        text: "你就那么停着。\n大概，一分钟。",
        fixed: 4200
      },
      {
        id: "15",
        bg: "silence",
        silent: true,
        type: "center",
        reveal: "lines",
        text: "再也不能这样过下去了！\n绝对不行！！！",
        fixed: 5200
      },
      {
        id: "16",
        bg: "door",
        bgm: "warm",
        small: true,
        text: "醒过来，你没急着怪外面没机会。\n你问的是：我到底卡在哪。\n想明白了——不是没路，是我把自己关在这屋里，根本没出去。"
      },
      {
        id: "17",
        bg: "street",
        bed: "street",
        bgm: "warm",
        small: true,
        text: "那就先把这个根解决了——出去，动起来。\n可往哪动？\n你想起隔壁那个大哥，看着也没什么了不起，照样把钱赚了。\n你想的不是“我要像他”——是：他能，这条路逻辑上就走得通，那我也能。"
      },
      {
        id: "18",
        bg: "knife",
        bgm: "warm",
        type: "heart",
        reveal: "lines",
        text: "你没等看清整条路。\n前面全是荆棘——\n但你认了：\n先动，先试了再说。\n要用砍刀，\n砍出一条路来。",
        fixed: 7200
      },
      {
        id: "19",
        bg: "notebook",
        bed: "street",
        bgm: "warm",
        small: true,
        text: "你把百度当老师，一个词一个词地啃。\n出门兜里揣个小本子——\n生怕哪个词没懂，被人看出是新来的。"
      },
      {
        id: "20",
        bg: "money",
        bed: "street",
        bgm: "warm",
        small: true,
        text: "第一单，三百万的承兑，你带着资金方做成。\n临走，他甩过来一张一百块，“带路费”。\n你没去算这数对不对——心里只有一个念头，清清楚楚：\n我还成单了。\n路，砍开了第一道口子。"
      },
      {
        id: "21",
        bg: "witness",
        silent: true,
        type: "photo",
        img: "assets/img/card21-placeholder.png",
        audio: "assets/audio/card21-mother-20260620.m4a",
        fixed: 90000,
        text: "那个下午，到今天，十五年了。\n现在想起，还是从背脊升起一种没来由的恐惧。\n可怕的是当时一点都不觉得自己有问题。\n那时候还觉得自己活得挺明白，看不起那些追名逐利的人，觉得他们俗。\n看看小说、看看电影、写写影评，觉得精神世界比他们丰富，充实。\n现在才明白，那是潜意识在逃避，给自己的懒、自己的颓废，编了一个理由，还那样的合情合理，连自己都信了。\n水已经烫了，不知道；已经快烂了，也不知道。还在那儿觉得，挺好。\n那天，那只水杯就在手边，却懒得动一下身子……那一刻的触动，那个梦醒，有点不寒而栗！也许这辈子都不会发现：其实人生，完全可以有另一种选择。\n那是被自己吓醒的！"
      },
      {
        id: "22",
        bg: "witness",
        silent: true,
        type: "center",
        text: "我们其实都有过这样的时刻——\n以为自己跟别人不一样，看得更透，活得更不同；\n其实，只是给自己找了一个很完美的理由，\n而且自己完全不觉得哪里不对。",
        fixed: 9500
      }
    ];

    const stage = document.getElementById("stage");
    const bgLayer = document.getElementById("bgLayer");
    const content = document.getElementById("content");
    const cover = document.getElementById("cover");
    const startBtn = document.getElementById("startBtn");
    const progressBar = document.getElementById("progressBar");
    const phone = document.getElementById("phone");

    let index = 0;
    let timer = null;
    let pressTimer = null;
    let paused = false;
    let running = false;
    let touchMoved = false;
    let activeAudio = null;
    let bedAudio = null;
    let bgmAudio = null;
    let currentBed = null;
    let currentBgm = null;
    let unlocked = false;
    let audioContext = null;

    function durationFor(card) {
      if (card.fixed) return card.fixed;
      const raw = (card.text || card.title || "").replace(/[\s\n，。——、“”【】（）]/g, "");
      return Math.max(3400, raw.length * 260 + 1100);
    }

    function clearTimer() {
      if (timer) window.clearTimeout(timer);
      timer = null;
    }

    function progressValue() {
      const playable = cards.filter(card => !card.pause).length;
      const played = cards.slice(0, index + 1).filter(card => !card.pause).length;
      return Math.min(100, Math.max(0, (played / playable) * 100));
    }

    function setProgress() {
      progressBar.style.width = `${progressValue()}%`;
    }

    function setBackground(card) {
      bgLayer.className = "bg-layer";
      if (card && card.bg) bgLayer.classList.add(`bg-${card.bg}`);
    }

    function unlockAudio() {
      if (unlocked) return;
      unlocked = true;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) {
        try {
          audioContext = new Ctx();
          if (audioContext.state === "suspended") audioContext.resume();
          const source = audioContext.createBufferSource();
          source.buffer = audioContext.createBuffer(1, 1, 22050);
          source.connect(audioContext.destination);
          source.start(0);
        } catch (error) {}
      }
    }

    function stopAudio(audio) {
      if (!audio) return;
      audio.pause();
      audio.currentTime = 0;
    }

    function stopActiveAudio() {
      if (!activeAudio) return;
      stopAudio(activeAudio);
      activeAudio = null;
    }

    function stopBed() {
      stopAudio(bedAudio);
      bedAudio = null;
      currentBed = null;
    }

    function stopBgm() {
      stopAudio(bgmAudio);
      bgmAudio = null;
      currentBgm = null;
    }

    function playLoop(kind, key, volume) {
      const map = kind === "bed" ? BED_TRACKS : BGM_TRACKS;
      const current = kind === "bed" ? currentBed : currentBgm;
      if (!key || !map[key]) {
        if (kind === "bed") stopBed();
        if (kind === "bgm") stopBgm();
        return;
      }
      if (current === key) return;
      if (kind === "bed") stopBed();
      if (kind === "bgm") stopBgm();
      const audio = new Audio(map[key]);
      audio.loop = true;
      audio.volume = volume;
      const playResult = audio.play();
      if (playResult && typeof playResult.catch === "function") {
        playResult.catch(() => {});
      }
      if (kind === "bed") {
        bedAudio = audio;
        currentBed = key;
      } else {
        bgmAudio = audio;
        currentBgm = key;
      }
    }

    function applyAudioState(card) {
      if (card.silent) {
        stopBed();
        stopBgm();
        return;
      }
      playLoop("bed", card.bed, 0.2);
      playLoop("bgm", card.bgm, 0.16);
    }

    function playCardAudio(card, onEnded, onFallback) {
      stopActiveAudio();
      if (!card.audio) return false;
      const audio = new Audio(card.audio);
      audio.volume = 1;
      activeAudio = audio;
      let settled = false;
      const fallback = () => {
        if (settled || audio !== activeAudio) return;
        settled = true;
        stopActiveAudio();
        if (typeof onFallback === "function") onFallback();
      };
      audio.addEventListener("ended", () => {
        if (settled || audio !== activeAudio) return;
        settled = true;
        activeAudio = null;
        if (typeof onEnded === "function") onEnded();
      }, { once: true });
      audio.addEventListener("error", fallback, { once: true });
      try {
        const playResult = audio.play();
        if (playResult && typeof playResult.catch === "function") {
          playResult.catch(fallback);
        }
        return true;
      } catch (error) {
        fallback();
        return false;
      }
    }

    function scheduleNext(card) {
      clearTimer();
      if (!running || paused || card.pause || index >= cards.length - 1) return;
      timer = window.setTimeout(nextCard, durationFor(card));
    }

    function buildRevealLines(text) {
      return text.split("\n").map((line, i) =>
        `<span class="reveal-line" style="animation-delay:${i * 0.86}s">${escapeHtml(line)}</span>`
      ).join("");
    }

    function renderCard(card) {
      stage.classList.add("fade");
      window.setTimeout(() => {
        setBackground(card);
        applyAudioState(card);

        const cls = [
          "text",
          card.type === "center" ? "center" : "",
          card.type === "heart" ? "heart" : "",
          card.small ? "small" : ""
        ].filter(Boolean).join(" ");

        let scheduleByDefault = true;

        if (card.pause) {
          stopActiveAudio();
          if (card.choiceType === "image") {
            content.innerHTML = `
              <div class="image-choices">
                ${card.choices.map((choice, i) => `
                  <button class="image-choice" data-choice="${i}" data-art="${escapeHtml(choice.art)}">
                    <span class="choice-art"></span>
                    <span class="choice-label">${escapeHtml(choice.label)}</span>
                  </button>
                `).join("")}
              </div>
            `;
          } else {
            content.innerHTML = `
              <div class="text small">${escapeHtml(card.title)}</div>
              <div class="choices">
                ${card.choices.map((choice, i) => `<button class="choice" data-choice="${i}">${escapeHtml(choice.label)}</button>`).join("")}
              </div>
            `;
          }
          content.querySelectorAll("[data-choice]").forEach(btn => {
            btn.addEventListener("click", event => {
              event.stopPropagation();
              const choice = card.choices[Number(btn.dataset.choice)];
              handleChoice(choice);
            });
          });
        } else if (card.type === "photo") {
          const [lead, ...rest] = card.text.split("\n");
          content.innerHTML = `
            <img class="card-photo" src="${escapeHtml(card.img)}" alt=""
                 onerror="this.outerHTML='<div class=&quot;photo-fallback&quot;>〔真容照 / 青蛙画面占位〕</div>'">
            <div class="photo-copy">
              <div class="text">${escapeHtml(lead)}</div>
              <div class="text small">${escapeHtml(rest.join("\n"))}</div>
            </div>
          `;
          if (card.audio) {
            scheduleByDefault = false;
            playCardAudio(
              card,
              () => {
                clearTimer();
                timer = window.setTimeout(nextCard, 1800);
              },
              () => scheduleNext(card)
            );
          }
        } else if (card.reveal === "lines") {
          stopActiveAudio();
          content.innerHTML = `<div class="${cls}">${buildRevealLines(card.text)}</div>`;
        } else if (!card.text) {
          stopActiveAudio();
          content.innerHTML = "";
        } else {
          stopActiveAudio();
          content.innerHTML = `<div class="${cls}">${escapeHtml(card.text)}</div>`;
        }

        setProgress();
        stage.classList.remove("fade");
        if (scheduleByDefault) scheduleNext(card);
      }, 500);
    }

    function renderFeedback(text, nextIndex) {
      if (!text) {
        index = nextIndex;
        renderCard(cards[index]);
        return;
      }
      stage.classList.add("fade");
      window.setTimeout(() => {
        stopActiveAudio();
        content.innerHTML = `<div class="text center">${escapeHtml(text)}</div>`;
        stage.classList.remove("fade");
        clearTimer();
        timer = window.setTimeout(() => {
          index = nextIndex;
          renderCard(cards[index]);
        }, durationFor({ text, fixed: 2600 }));
      }, 500);
    }

    function handleChoice(choice) {
      const nextIndex = index + 1;
      renderFeedback(choice.feedback, nextIndex);
    }

    function nextCard() {
      if (!running || paused) return;
      const card = cards[index];
      if (card.pause) return;
      if (index >= cards.length - 1) return;
      index += 1;
      renderCard(cards[index]);
    }

    function start() {
      unlockAudio();
      running = true;
      paused = false;
      index = 0;
      cover.style.display = "none";
      renderCard(cards[index]);
    }

    function pause() {
      if (!running) return;
      paused = true;
      clearTimer();
      [activeAudio, bedAudio, bgmAudio].forEach(audio => {
        if (audio) audio.pause();
      });
      phone.classList.add("paused");
    }

    function resume() {
      if (!running) return;
      paused = false;
      phone.classList.remove("paused");
      [activeAudio, bedAudio, bgmAudio].forEach(audio => {
        if (!audio) return;
        try {
          const playResult = audio.play();
          if (playResult && typeof playResult.catch === "function") {
            playResult.catch(() => {});
          }
        } catch (error) {}
      });
      scheduleNext(cards[index]);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    startBtn.addEventListener("click", start);

    stage.addEventListener("pointerdown", () => {
      touchMoved = false;
      pressTimer = window.setTimeout(pause, 520);
    });

    stage.addEventListener("pointermove", () => {
      touchMoved = true;
    });

    stage.addEventListener("pointerup", () => {
      if (pressTimer) window.clearTimeout(pressTimer);
      if (paused) { resume(); return; }
      if (!touchMoved) nextCard();
    });

    stage.addEventListener("pointercancel", () => {
      if (pressTimer) window.clearTimeout(pressTimer);
      if (paused) resume();
    });
  </script>
</body>
</html>
